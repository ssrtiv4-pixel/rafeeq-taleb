  /* ===== Duel & Tournament ===== */

  .duel-result{ text-align:center; padding:10px 4px; }
  .duel-result .big-emoji{ font-size:44px; margin-bottom:8px; }
  .duel-result h3{ font-family:'Amiri',serif; font-size:22px; color:var(--gold-light); margin:6px 0 10px; }
  .duel-result .points-line{ font-size:14px; color:var(--ok); margin-bottom:4px; }
  .duel-result .points-line.neg{ color:var(--danger); }
  .duel-history-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:10px; background:rgba(253,246,240,0.03); border:1px solid rgba(255,138,92,0.15); margin-bottom:8px; font-size:13px; }
  .duel-history-item .res-win{ color:var(--ok); font-weight:800; }
  .duel-history-item .res-lose{ color:var(--danger); font-weight:800; }
  .duel-history-item .res-tie{ color:var(--text-dim); font-weight:800; }

  .bracket-round{ margin-bottom:18px; }
  .bracket-round-title{ font-size:13px; color:var(--gold-light); font-family:'Amiri',serif; margin-bottom:8px; text-align:center; }
  .bracket-match{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,138,92,0.2); background:rgba(253,246,240,0.03); margin-bottom:8px; font-size:13px; }

  .bracket-match .bp.win{ color:var(--ok); font-weight:800; }
  .bracket-match .bp.pending{ color:var(--text-dim); }
  .prize-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .prize-item{ display:flex; justify-content:space-between; padding:8px 12px; border-radius:8px; background:rgba(255,138,92,0.08); border:1px solid rgba(255,138,92,0.2); font-size:13px; }

  /* ===================================================================
     ثيم مختلف لكل صفحة: ألوان + شكل مختلف (نصف قطر الحواف + زوايا الأزرار)
     يعتمد على data-page المضبوطة على body حسب متغير view الحالي
     =================================================================== */

  /* تسجيل الدخول / التسجيل — بنفسجي-كورال (الافتراضي) */
  body[data-page="login"], body[data-page="register"], body[data-page="loading"]{
    --gold:#ff8a5c; --gold-light:#ffb199; --ok:#3ddc97; --danger:#e05260;
    --bg-deep:#1a1035; --bg-deep2:#241750; --text-dim:#c7b8e0;
    --radius-card:28px; --radius-btn:999px; --radius-input:16px; --btn-angle:120deg; --btn-border:transparent;
  }

  /* الرئيسية — أخضر زمردي / تركواز، بطاقات مربّعة الزوايا نسبياً */
  body[data-page="main"]{
    --gold:#2fd6a8; --gold-light:#7cf0cf; --ok:#ffd166; --danger:#ff6b6b;
    --bg-deep:#062b26; --bg-deep2:#0b3f38; --text-dim:#a9d8ce;
    --radius-card:20px; --radius-btn:12px; --radius-input:12px; --btn-angle:90deg; --btn-border:transparent;
  }

  /* المسابقات ومراجعة الأخطاء — برتقالي ناري حماسي، زوايا متوسطة */
  body[data-page="quiz"], body[data-page="review"]{
    --gold:#ff5e3a; --gold-light:#ffa26b; --ok:#7ee081; --danger:#ff3860;
    --bg-deep:#2a0f08; --bg-deep2:#3d160b; --text-dim:#e0b8a6;
    --radius-card:16px; --radius-btn:10px; --radius-input:10px; --btn-angle:60deg; --btn-border:transparent;
  }

  /* عجلة الحظ والمتجر — أرجواني/ذهبي احتفالي، دائري جداً */
  body[data-page="wheel"], body[data-page="store"]{
    --gold:#e6b80a; --gold-light:#ffe27a; --ok:#3ddc97; --danger:#ff5b7a;
    --bg-deep:#2b0f3d; --bg-deep2:#3d1656; --text-dim:#d8c2e8;
    --radius-card:34px; --radius-btn:999px; --radius-input:20px; --btn-angle:135deg; --btn-border:transparent;
  }

  /* المتصدرون / الملف الشخصي / الأصدقاء / الفرق / ساهم بسؤالك — وردي دافئ */
  body[data-page="leaderboard"], body[data-page="profile"], body[data-page="friends"], body[data-page="team"], body[data-page="suggest"]{
    --gold:#ff5da2; --gold-light:#ffa9cf; --ok:#3ddc97; --danger:#ff6b6b;
    --bg-deep:#2a0a1e; --bg-deep2:#3d1030; --text-dim:#e0b8cf;
    --radius-card:22px; --radius-btn:18px; --radius-input:14px; --btn-angle:100deg; --btn-border:transparent;
  }

  /* التحديات والبطولات — أحمر/أسود قتالي، زوايا حادة */
  body[data-page="duel"], body[data-page="local-duel"], body[data-page="duel-match"], body[data-page="tournament"]{
    --gold:#ff2d55; --gold-light:#ff7a94; --ok:#3ddc97; --danger:#ffce00;
    --bg-deep:#120608; --bg-deep2:#210b10; --text-dim:#d9a9ae;
    --radius-card:8px; --radius-btn:6px; --radius-input:6px; --btn-angle:0deg; --btn-border:var(--gold);
  }

  /* الشات — نعناعي هادئ */
  body[data-page="chat"]{
    --gold:#2dd4bf; --gold-light:#7ee8d8; --ok:#a3e635; --danger:#fb7185;
    --bg-deep:#04211d; --bg-deep2:#08332c; --text-dim:#a6d8cf;
    --radius-card:20px; --radius-btn:16px; --radius-input:16px; --btn-angle:90deg; --btn-border:transparent;
  }

  /* لوحات الأدمن — رمادي محايد أنيق، زوايا بسيطة */
  body[data-page="admin"], body[data-page="control-panel"]{
    --gold:#8b93a8; --gold-light:#c3c9d6; --ok:#3ddc97; --danger:#ff6b6b;
    --bg-deep:#12141c; --bg-deep2:#1b1e29; --text-dim:#9aa1b4;
    --radius-card:12px; --radius-btn:8px; --radius-input:8px; --btn-angle:180deg; --btn-border:transparent;
  }

  /* ===================================================================
     الوضع الليلي / النهاري — يعمل فوق ثيمات الصفحات، بيغيّر خلفية عامة
     وألوان النصوص فقط، ويسيب لون كل صفحة المميز (--gold) زي ما هو
     =================================================================== */
  body[data-mode="light"]{
    --bg-deep:#f7f2ff;
    --bg-deep2:#ffffff;
    --text-light:#241750;
    --text-dim:#6a5c92;
    background:
      radial-gradient(circle at 12% 8%, #ffffff 0%, transparent 48%),
      radial-gradient(circle at 92% 12%, #ff8a5c14 0%, transparent 42%),
      radial-gradient(circle at 88% 90%, #3ddc9714 0%, transparent 40%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep2) 100%);
  }
  body[data-mode="light"] input[type=text],
  body[data-mode="light"] input[type=password],
  body[data-mode="light"] .admin-input,
  body[data-mode="light"] .chat-input-row textarea{
    background:rgba(36,23,80,0.05);
    border-color:rgba(36,23,80,0.2);
  }
  body[data-mode="light"] .card,
  body[data-mode="light"] .dhikr-item,
  body[data-mode="light"] .prayer-item,
  body[data-mode="light"] .quiz-opt,
  body[data-mode="light"] .nav-btn,
  body[data-mode="light"] .profile-stat,
  body[data-mode="light"] .chat-msg-other,
  body[data-mode="light"] .topbar,
  body[data-mode="light"] .progress-bar{
    background:rgba(36,23,80,0.05);
  }
  body[data-mode="light"] .btn:disabled{
    background:#e3ddf2; color:#a89ecb;
  }
  body[data-mode="light"] .welcome-overlay{
    background:rgba(36,23,80,0.45);
  }
  .mode-toggle-btn{
    position:fixed; top:16px; left:16px; z-index:999;
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,138,92,0.35);
    color:var(--text-light); font-size:18px; cursor:pointer;
    box-shadow:0 6px 16px rgba(10,4,30,0.25);
    transition:transform .15s ease, background .2s ease;
  }
  .mode-toggle-btn:active{ transform:scale(.9); }
  body[data-mode="light"] .mode-toggle-btn{
    background:rgba(36,23,80,0.06); border-color:rgba(36,23,80,0.2);
  }

</style>

const QUESTIONS_PER_DAY = 4;
const QUIZ_LEVEL_LABELS = ['المستوى الأول 🟢', 'المستوى الثاني 🔵', 'المستوى الثالث 🟠', 'المستوى الرابع 🔴'];

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function getTodayEpochDay(){
  return Math.floor(Date.now() / 86400000);
}
// يحوّل اسم المستخدم لرقم ثابت (seed) يُستخدم لإزاحة ترتيب الأسئلة اليومية
// بحيث يحصل كل مستخدم على مجموعة أسئلة مختلفة عن غيره، مع بقاء الاختيار
// ثابتاً لنفس المستخدم طوال نفس اليوم، ومتغيّراً تلقائياً كل يوم جديد.
function hashStringToInt(str){
  let h = 0;
  for(let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }
  return h >>> 0;
}

// تقسيم بنك الأسئلة الديني إلى 4 مستويات متساوية تقريباً (كل مستوى = ربع البنك).
// كل مستوى يحتفظ بترتيب "خلط" ثابت خاص به (seed ثابت مستقل عن التاريخ)، بحيث
// يمر النظام على كل أسئلة المستوى مرة واحدة بالكامل قبل أن يكرر أي سؤال،
// وموضع اليوم داخل هذا الترتيب يُحدَّد فقط من خلال تاريخ اليوم (epochDay).
let DAILY_QUIZ_POOL = DUEL_QUESTION_POOL;
let DAILY_QUIZ_LEVELS = (function buildDailyQuizLevels(){
  const total = DAILY_QUIZ_POOL.length;
  const levelsCount = QUESTIONS_PER_DAY;
  const perLevel = Math.max(1, Math.floor(total / levelsCount));
  const levels = [];
  for(let lvl = 0; lvl < levelsCount; lvl++){
    const start = lvl * perLevel;
    const end = (lvl === levelsCount - 1) ? total : Math.min(total, start + perLevel);
    const indices = [];
    for(let i = start; i < end; i++) indices.push(i);
    levels.push(indices.length ? indices : [0]);
  }
  return levels;
})();
// ترتيب خلط ثابت لكل مستوى (لا يعتمد على التاريخ) يضمن عدم تكرار سؤال قبل
// المرور على كل أسئلة مستواه.
let DAILY_QUIZ_LEVEL_ORDER = DAILY_QUIZ_LEVELS.map((indices, lvl) => {
  const rand = mulberry32(90000 + lvl * 7919);
  const order = indices.slice();
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
});

// يرجع 4 مؤشرات (فهارس) داخل DAILY_QUIZ_POOL — واحد من كل مستوى — بناءً على
// تاريخ اليوم فقط، فتكون نفس الأسئلة لكل المستخدمين في نفس اليوم، وتتغيّر
// تلقائياً كل يوم بمجرد تغيّر epochDay.
function getDailyQuestionIndices(epochDay, username){
  const userSeed = username ? hashStringToInt(String(username)) : 0;
  return DAILY_QUIZ_LEVEL_ORDER.map(order => {
    if(!order.length) return 0;
    const pos = (((epochDay + userSeed) % order.length) + order.length) % order.length;
    return order[pos];
  });
}
function getDailyQuestionLevel(qIndex){
  for(let lvl = 0; lvl < DAILY_QUIZ_LEVELS.length; lvl++){
    if(DAILY_QUIZ_LEVELS[lvl].includes(qIndex)) return lvl;
  }
  return 0;
}

function rebuildQuestionRuntimePools(){
  DAILY_QUIZ_POOL = DUEL_QUESTION_POOL;
  const explicitLevels = [[],[],[],[]];
  DUEL_QUESTION_POOL.forEach((q, i) => {
    const lvl = Math.min(4, Math.max(1, Number(q.level) || (Math.floor(i / Math.max(1, Math.ceil(DUEL_QUESTION_POOL.length / 4))) + 1))) - 1;
    explicitLevels[lvl].push(i);
  });
  DAILY_QUIZ_LEVELS = explicitLevels.map((arr, i) => arr.length ? arr : [Math.min(i, Math.max(0, DUEL_QUESTION_POOL.length-1))]);
  DAILY_QUIZ_LEVEL_ORDER = DAILY_QUIZ_LEVELS.map((indices, lvl) => {
    const rand = mulberry32(90000 + lvl * 7919);
    const order = indices.slice();
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return order;
  });
}

function getTip(dayIndex){
  const coreIdx = Math.floor(dayIndex / 20) % 20;
  const frameIdx = dayIndex % 20;
  return FRAME[frameIdx](CORE[coreIdx]);
}

  if(!s) return freshState();
  if(typeof s.points !== 'number') s.points = 0;
  if(typeof s.xp !== 'number') s.xp = s.points;
  if(typeof s.correctAnswers !== 'number') s.correctAnswers = 0;
  if(typeof s.profileImageUrl !== 'string') s.profileImageUrl = '';
  if(typeof s.wheelWins !== 'number') s.wheelWins = 0;
  if(typeof s.duelWins !== 'number') s.duelWins = 0;
  if(typeof s.duelLosses !== 'number') s.duelLosses = 0;
  if(typeof s.suggestionsSubmitted !== 'number') s.suggestionsSubmitted = 0;
  if(!s.unlockedTips || typeof s.unlockedTips !== 'object') s.unlockedTips = {};
  if(typeof s.quizDate !== 'number') s.quizDate = null;
  if(!Array.isArray(s.quizAnsweredToday)) s.quizAnsweredToday = [];
  if(typeof s.wheelNextSpinAt !== 'number') s.wheelNextSpinAt = null;
  if(typeof s.khatmaCompletions !== 'number') s.khatmaCompletions = 0;
  if(typeof s.wirdAyahCursor !== 'number'){
    // ترقية من النظام القديم (عدد السور) إلى النظام الجديد (مؤشر آيات) إن وُجد تقدّم سابق
    if(typeof s.wirdSurahsRead === 'number' && s.wirdSurahsRead > 0){
      let n = s.wirdSurahsRead % TOTAL_SURAHS, cursor = 0;
      for(let i=0;i<n;i++) cursor += SURAHS[i].ayahs;
      s.wirdAyahCursor = cursor;
    } else {
      s.wirdAyahCursor = 0;
    }
    delete s.wirdSurahsRead;
  }
  if(typeof s.wirdLastDoneDay !== 'number') s.wirdLastDoneDay = null;
  if(!s.wrongQuestions || typeof s.wrongQuestions !== 'object') s.wrongQuestions = {};
  if(!s.streak || typeof s.streak !== 'object') s.streak = {count:0, longest:0, lastDay:null};
  if(typeof s.streak.count !== 'number') s.streak.count = 0;
  if(typeof s.streak.longest !== 'number') s.streak.longest = 0;
  if(typeof s.streak.lastDay !== 'number') s.streak.lastDay = null;
  if(!Array.isArray(s.xpHistory)) s.xpHistory = [];
  if(!s.badges || typeof s.badges !== 'object') s.badges = {};
  if(!Array.isArray(s.friends)) s.friends = [];
  if(typeof s.teamId !== 'string') s.teamId = s.teamId || null;
  return s;
}

// ===================== الستريك اليومي + سجل XP للرسم البياني =====================
function recordDailyActivity(){
  const today = getTodayEpochDay();
  if(!state.streak || typeof state.streak !== 'object') state.streak = {count:0, longest:0, lastDay:null};
  const last = state.streak.lastDay;
  if(last !== today){
    state.streak.count = (last === today - 1) ? (state.streak.count||0) + 1 : 1;
    state.streak.lastDay = today;
    state.streak.longest = Math.max(state.streak.longest||0, state.streak.count);
  }
  if(!Array.isArray(state.xpHistory)) state.xpHistory = [];
  const lastEntry = state.xpHistory[state.xpHistory.length-1];
  if(lastEntry && lastEntry.day === today){
    lastEntry.xp = state.xp||0;
  } else {
    state.xpHistory.push({day:today, xp: state.xp||0});
    if(state.xpHistory.length > 30) state.xpHistory.shift();
  }
  return checkBadges();
}

function renderXpChartSvg(){
  const hist = Array.isArray(state.xpHistory) ? state.xpHistory.slice(-14) : [];
  if(hist.length < 2){
    return `<div class="xp-chart-empty">استمر في النشاط اليومي حتى يظهر لك رسم بياني لتقدّم الـXP 📈</div>`;
  }
  const w = 300, h = 90, pad = 8;
  const xs = hist.map((_,i)=> pad + (i*(w-2*pad))/(hist.length-1));
  const maxXp = Math.max(...hist.map(p=>p.xp), 1);
  const minXp = Math.min(...hist.map(p=>p.xp), 0);
  const range = Math.max(maxXp - minXp, 1);
  const ys = hist.map(p => h - pad - ((p.xp - minXp)/range) * (h-2*pad));
  const points = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const dots = xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.6" fill="#ff8a5c"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible">
    <polyline points="${points}" fill="none" stroke="#ff8a5c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

// ===================== راجع أخطاءك (مراجعة متباعدة) =====================
// فترات المراجعة المتباعدة بالمللي ثانية حسب "صندوق" لايتنر (Leitner) الذي وصل إليه السؤال
const REVIEW_INTERVALS_MS = [
  10*60*1000,          // صندوق 0: بعد 10 دقائق (أول مرة بعد الخطأ)
  1*24*60*60*1000,     // صندوق 1: يوم
  3*24*60*60*1000,     // صندوق 2: 3 أيام
  7*24*60*60*1000,     // صندوق 3: أسبوع
  16*24*60*60*1000,    // صندوق 4: 16 يوماً
  35*24*60*60*1000     // صندوق 5: 35 يوماً (ثم تبقى في هذا الصندوق)
];
function reviewKeyFor(qIndex, question){
  // مفتاح ثابت لا يعتمد فقط على الفهرس (الذي قد يتغيّر إن عُدّل بنك الأسئلة)
  return String(qIndex) + '::' + (question.q||'').slice(0,40);
}
function recordWrongAnswer(qIndex, question){
  const key = reviewKeyFor(qIndex, question);
  const now = Date.now();
  const existing = state.wrongQuestions[key];
  state.wrongQuestions[key] = {
    q: question.q,
    options: question.options,
    correct: question.correct,
    box: 0,
    wrongCount: existing ? (existing.wrongCount||0) + 1 : 1,
    lastWrongAt: now,
    nextReviewAt: now + REVIEW_INTERVALS_MS[0]
  };
}
function reviewAnswer(key, isCorrect){
  const item = state.wrongQuestions[key];
  if(!item) return;
  const now = Date.now();
  if(isCorrect){
    item.box = Math.min(REVIEW_INTERVALS_MS.length-1, (item.box||0)+1);
    item.nextReviewAt = now + REVIEW_INTERVALS_MS[item.box];
    // إن وصل السؤال لآخر صندوق ونجح فيه، يُعتبر متقناً ويُحذف من قائمة المراجعة
    if(item.box >= REVIEW_INTERVALS_MS.length-1){
      delete state.wrongQuestions[key];
      addXP(3);
    }
  } else {
    item.box = 0;
    item.wrongCount = (item.wrongCount||0)+1;
    item.nextReviewAt = now + REVIEW_INTERVALS_MS[0];
  }
}
let reviewCurrentKey = null;
let reviewAnswered = false;
let reviewSelected = null;
function renderReview(){
  const now = Date.now();
  const keys = Object.keys(state.wrongQuestions||{});
  const dueKeys = keys.filter(k => (state.wrongQuestions[k].nextReviewAt||0) <= now);

  if(keys.length === 0){
    root.innerHTML = `${topNavHtml('review')}
      <div class="card">
        <h2>🔁 راجع أخطاءك</h2>
        <div class="locked-note">لا توجد أسئلة أخطأت فيها حتى الآن. استمر في المسابقات وسنجمع هنا أي سؤال تخطئ فيه لمراجعته لاحقاً 🌱</div>
      </div>`;
    updateSyncBadge(); bindTopNav(); return;
  }
  if(dueKeys.length === 0){
    const soonest = keys.map(k=>state.wrongQuestions[k].nextReviewAt).sort((a,b)=>a-b)[0];
    root.innerHTML = `${topNavHtml('review')}
      <div class="card">
        <h2>🔁 راجع أخطاءك</h2>
        <div class="progress-wrap"><div class="progress-label"><span>أسئلة قيد المراجعة</span><span>${keys.length}</span></div></div>
        <div class="locked-note">لا توجد أسئلة مستحقة للمراجعة الآن.<br>موعد أقرب مراجعة: ${new Date(soonest).toLocaleString('ar-EG')}</div>
      </div>`;
    updateSyncBadge(); bindTopNav(); return;
  }

  const key = (reviewAnswered && reviewCurrentKey && dueKeys.includes(reviewCurrentKey)) ? reviewCurrentKey : dueKeys[0];
  reviewCurrentKey = key;
  const q = state.wrongQuestions[key];

  root.innerHTML = `
    ${topNavHtml('review')}
    <div class="card">
      <h2>🔁 راجع أخطاءك</h2>
      <div class="progress-wrap">
        <div class="progress-label"><span>مستحقة الآن</span><span>${dueKeys.length} / ${keys.length}</span></div>
      </div>
      <div class="quiz-q">${q.q}</div>
      ${q.options.map((opt,i)=>{
        let cls='quiz-opt';
        if(reviewAnswered){
          if(i===q.correct) cls+=' correct';
          else if(i===reviewSelected) cls+=' wrong';
        }
        return `<button class="${cls}" data-ropt="${i}" ${reviewAnswered?'disabled':''}>${opt}</button>`;
      }).join('')}
      ${reviewAnswered ? `<button class="btn" id="btn-next-review">${dueKeys.length>1?'السؤال التالي':'إنهاء المراجعة'}</button>` : ''}
    </div>
  `;
  updateSyncBadge();
  bindTopNav();
  if(!reviewAnswered){
    document.querySelectorAll('[data-ropt]').forEach(btn=>{
      btn.onclick = () => {
        const i = parseInt(btn.getAttribute('data-ropt'));
        reviewSelected = i;
        reviewAnswered = true;
        reviewAnswer(key, i===q.correct);
        render();
        persist();
      };
    });
  } else {
    const nextBtn = document.getElementById('btn-next-review');
    if(nextBtn) nextBtn.onclick = () => { reviewAnswered=false; reviewSelected=null; reviewCurrentKey=null; render(); };
  }
}

// نخزن الموقع (خط الطول والعرض) ومواقيت اليوم في localStorage، عشان المتصفح
// يسأل عن إذن الموقع مرة واحدة بس، مش في كل زيارة أو كل تحديث للصفحة.
let prayerTimesData = null; // {Fajr,Dhuhr,Asr,Maghrib,Isha, city}
let prayerTimesStatus = ''; // '', 'loading', 'ok', 'err', 'denied'
const PRAYER_LOC_KEY = 'rafeeq_prayer_loc';
const PRAYER_TIMES_CACHE_KEY = 'rafeeq_prayer_times_cache';

function getSavedPrayerLocation(){
  try{
    const raw = localStorage.getItem(PRAYER_LOC_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function savePrayerLocation(latitude, longitude){
  try{ localStorage.setItem(PRAYER_LOC_KEY, JSON.stringify({latitude, longitude})); }catch(e){}
}
function getCachedPrayerTimesForToday(){
  try{
    const raw = localStorage.getItem(PRAYER_TIMES_CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    if(c && c.date === getTodayEpochDay()) return c.times;
    return null;
  }catch(e){ return null; }
}
function cachePrayerTimesForToday(times){
  try{ localStorage.setItem(PRAYER_TIMES_CACHE_KEY, JSON.stringify({date:getTodayEpochDay(), times})); }catch(e){}
}
async function fetchPrayerTimesForCoords(latitude, longitude){
  const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=4`);
  const data = await res.json();
  const t = data && data.data && data.data.timings;
  if(!t) throw new Error('no timings');
  return { Fajr:t.Fajr, Dhuhr:t.Dhuhr, Asr:t.Asr, Maghrib:t.Maghrib, Isha:t.Isha };
}
async function loadPrayerTimes(){
  if(prayerTimesStatus==='loading' || prayerTimesStatus==='ok') return;
  prayerTimesStatus='loading';

  // 1) لو عندنا مواقيت مخزّنة لليوم الحالي، استخدمها فوراً من غير أي طلب شبكة أو إذن موقع
  const cachedTimes = getCachedPrayerTimesForToday();
  if(cachedTimes){
    prayerTimesData = cachedTimes;
    prayerTimesStatus = 'ok';
    if(view==='main') render();
    return;
  }

  // 2) لو عندنا موقع محفوظ من قبل، استخدمه مباشرة من غير ما نطلب إذن الموقع تاني
  const savedLoc = getSavedPrayerLocation();
  if(savedLoc){
    try{
      const times = await fetchPrayerTimesForCoords(savedLoc.latitude, savedLoc.longitude);
      prayerTimesData = times;
      prayerTimesStatus = 'ok';
      cachePrayerTimesForToday(times);
    }catch(e){
      console.warn('prayer times error', e);
      prayerTimesStatus = 'err';
    }
    if(view==='main') render();
    return;
  }

  // 3) أول مرة فقط: نطلب إذن الموقع، ونخزنه عشان ما نطلبوش تاني
  if(!navigator.geolocation){ prayerTimesStatus='err'; render(); return; }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const {latitude,longitude} = pos.coords;
      savePrayerLocation(latitude, longitude);
      const times = await fetchPrayerTimesForCoords(latitude, longitude);
      prayerTimesData = times;
      prayerTimesStatus='ok';
      cachePrayerTimesForToday(times);
    }catch(e){
      console.warn('prayer times error', e);
      prayerTimesStatus='err';
    }
    if(view==='main') render();
  }, (err)=>{
    console.warn('geolocation error', err);
    prayerTimesStatus='denied';
    if(view==='main') render();
  }, { timeout: 10000 });
}

function fmtCountdown(ms){
  if(ms < 0) ms = 0;
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  const s = Math.floor((ms%60000)/1000);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function getLevelInfo(xp){
  xp = Math.max(0, Number(xp)||0);
  const levels = [
    {min:0,name:'مبتدئ',icon:'🌱',next:100},
    {min:100,name:'متقدم',icon:'⚡',next:300},
    {min:300,name:'محترف',icon:'🔥',next:700},
    {min:700,name:'خبير',icon:'🏆',next:1500},
    {min:1500,name:'أسطورة',icon:'👑',next:null}
  ];
  let cur=levels[0];
  for(const l of levels) if(xp>=l.min) cur=l;
  const progress = cur.next ? Math.min(100, Math.round(((xp-cur.min)/(cur.next-cur.min))*100)) : 100;
  return {...cur, progress};
}

// يحوّل ملف صورة إلى Data URL (Base64) بعد تصغيره وضغطه، بحيث يصلح
// للتخزين المباشر داخل مستند Firestore (بدلاً من Firebase Storage الذي
// يتطلب خطة Blaze المدفوعة). حد حجم المستند في Firestore ~1 ميجابايت.
function fileToResizedDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('تعذّرت قراءة ملف الصورة.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('تعذّر فتح الصورة، تأكد أن الملف صورة صالحة.'));
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > height){
          if(width > maxDim){ height = Math.round(height * (maxDim / width)); width = maxDim; }
        } else {
          if(height > maxDim){ width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadProfileImage(file){
  if(!file) return;
  if(!file.type.startsWith('image/')) throw new Error('الملف المختار ليس صورة.');
  if(file.size > 5 * 1024 * 1024) throw new Error('حجم الصورة يجب ألا يتجاوز 5 ميجابايت.');
  let dataUrl = await fileToResizedDataURL(file, 400, 0.75);
  if(dataUrl.length > 700000) dataUrl = await fileToResizedDataURL(file, 300, 0.6);
  if(dataUrl.length > 900000) throw new Error('الصورة كبيرة جداً حتى بعد الضغط. جرّب صورة أخرى أو بحجم أصغر.');
  await saveProfileImage(dataUrl);
  state.profileImageUrl = dataUrl;
}

// (وبالتالي أي زرار بينتظره ما يفضلش عالق على "جارِ..." من غير أي رد فعل)
function withTimeout(promise, ms = 15000){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('انتهت مهلة الاتصال بقاعدة البيانات')), ms))
  ]);
}

}

}

function fmtLastActive(ts){
  if(!ts) return 'لا يوجد نشاط بعد';
  const ms = typeof ts.toMillis === 'function' ? ts.toMillis() : (typeof ts === 'number' ? ts : null);
  if(!ms) return 'لا يوجد نشاط بعد';
  const diff = Date.now() - ms;
  if(diff < 5*60000) return 'نشط الآن 🟢';
  if(diff < 60*60000) return `منذ ${Math.floor(diff/60000)} دقيقة`;
  if(diff < 24*3600000) return `منذ ${Math.floor(diff/3600000)} ساعة`;
  return `منذ ${Math.floor(diff/86400000)} يوم`;
}

   Collections المستخدمة:
   - duel_queue/{username}   : طابور البحث عن خصم

function pickRandomQuestionIndices(count){
  const idxs = DUEL_QUESTION_POOL.map((_, i) => i);
  for(let i = idxs.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  return idxs.slice(0, Math.min(count, idxs.length));
}

function freshDuelProgress(){
  return { answers: [], score: 0, finishedAt: null, disconnected: false, lastPing: Date.now() };
}

// يحاول إيجاد خصم منتظر في الطابور، وإلا يسجّل اللاعب الحالي فيه وينتظر
async function findOrJoinDuelQueue(){
  duelSearching = true;
  errorMsg = '';
  render();

  try{
    const queueRef = db.collection('duel_queue');
    const existing = await queueRef.where('status','==','waiting').orderBy('joinedAt','asc').limit(5).get();
    let opponentDoc = null;
    existing.forEach(doc => {
      if(!opponentDoc && doc.id !== docId(currentUser)) opponentDoc = doc;
    });

    if(opponentDoc){
      // حاول مطابقة نفسك مع هذا الخصم داخل Transaction لتفادي تعارض لاعبَين تالتين
      const newDuelId = await db.runTransaction(async (tx) => {
        const oppRef = queueRef.doc(opponentDoc.id);
        const oppSnap = await tx.get(oppRef);
        if(!oppSnap.exists || oppSnap.data().status !== 'waiting'){
          return null; // اتاخد قبلي
        }
        const opponentName = oppSnap.data().username;
        const questionIndices = pickRandomQuestionIndices(DUEL_QUESTIONS_COUNT);
        const newDuelRef = db.collection('duels').doc();
        tx.set(newDuelRef, {
          players: [opponentName, currentUser],
          questionIndices,
          status: 'active',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          startAt: firebase.firestore.FieldValue.serverTimestamp(),
          progress: {
            [docId(opponentName)]: freshDuelProgress(),
            [docId(currentUser)]: freshDuelProgress()
          },
          names: { [docId(opponentName)]: opponentName, [docId(currentUser)]: currentUser },
          result: null
        });
        tx.update(oppRef, { status:'matched', duelId:newDuelRef.id });
        tx.delete(queueRef.doc(docId(currentUser))); // تأكيد عدم بقائي في الطابور لو كنت فيه
        return newDuelRef.id;
      });

      if(newDuelId){
        duelSearching = false;
        await enterDuel(newDuelId);
        return;
      }
      // لو حد سبقني على نفس الخصم، سجّلني في الطابور وانتظر مطابقة تلقائية
    }

    // مفيش خصم متاح الآن → سجّلني في الطابور وانتظر أن ياخدني حد آخر
    await queueRef.doc(docId(currentUser)).set({
      username: currentUser,
      status: 'waiting',
      joinedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    listenToQueueForMatch();
  }catch(e){
    console.error('duel queue error:', e);
    duelSearching = false;
    errorMsg = 'حدث خطأ أثناء البحث عن خصم، حاول مرة أخرى.';
    render();
  }
}

function listenToQueueForMatch(){
  if(duelQueueUnsub) duelQueueUnsub();
  duelQueueUnsub = db.collection('duel_queue').doc(docId(currentUser))

      if(!snap.exists) return;
      const d = snap.data();
      if(d.status === 'matched' && d.duelId){
        if(duelQueueUnsub){ duelQueueUnsub(); duelQueueUnsub = null; }
  if(friendInviteUnsub){friendInviteUnsub();friendInviteUnsub=null;}
        duelSearching = false;
        await enterDuel(d.duelId);
      }
    });
}

// كل لاعب يراقب نبضة خصمه فقط (مش نفسه) — لو انقطعت لمدة أطول من HEARTBEAT_TIMEOUT_MS
// أثناء أن المباراة لسه شغالة، يعتبره منسحب ويطبّق عليه العقوبة (بدون التأثير على وقته هو).
function startDuelWatchdog(){
  stopDuelWatchdog();
  duelWatchdogTimer = setInterval(() => {
    if(!duelId || !duelData || duelData.status !== 'active') return;
    const oppKey = Object.keys(duelData.progress).find(k => k !== docId(currentUser));
    if(!oppKey) return;
    const opp = duelData.progress[oppKey];
    if(opp.finishedAt || opp.disconnected) return;
    const lastPing = opp.lastPing || 0;
    if(Date.now() - lastPing > HEARTBEAT_TIMEOUT_MS){
      const oppName = duelData.names ? duelData.names[oppKey] : oppKey;
      applyDuelDisconnectPenalty(oppName, 'timeout', oppKey);
    }
  }, 3000);
}
function stopDuelWatchdog(){
  if(duelWatchdogTimer){ clearInterval(duelWatchdogTimer); duelWatchdogTimer = null; }
}

function startDuelTicker(){
  stopDuelTicker();
  duelTickTimer = setInterval(() => {
    if(view === 'duel-match') render();
  }, 1000);
}
function stopDuelTicker(){

}

function duelElapsedMs(){
  if(!duelData) return 0;
  const start = duelData.startAt && duelData.startAt.toMillis ? duelData.startAt.toMillis() : Date.now();
  return Date.now() - start;
}
function duelRemainingMs(){
  return Math.max(0, DUEL_TIME_LIMIT_MS - duelElapsedMs());
}

// تُطبَّق مرة واحدة فقط: تقفل مرحلة اللاعب المنسحب/الغشاش، وتخصم منه 50 نقطة
// (يسمح بالسالب)، مع الاحتفاظ بعدد إجاباته الصحيحة حتى لحظة الخروج فقط.
async function applyDuelDisconnectPenalty(username, reason, knownKey){
  const key = knownKey || docId(username);
  const ref = db.collection('duels').doc(duelId);
  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if(!snap.exists) return;
      const d = snap.data();
      if(d.status !== 'active') return;
      const prog = d.progress[key];
      if(!prog || prog.disconnected || prog.finishedAt) return;
      tx.update(ref, {
        [`progress.${key}.disconnected`]: true,
        [`progress.${key}.disconnectReason`]: reason,
        [`progress.${key}.finishedAt`]: Date.now()
      });
    });
  }catch(e){ console.error('disconnect penalty tx error:', e); }

  // خصم النقاط من حساب اللاعب نفسه (يسمح بالرصيد السالب)
  try{
    await db.runTransaction(async (tx) => {
      const accRef = db.collection('accounts').doc(key);
      const accSnap = await tx.get(accRef);
      if(!accSnap.exists) return;
      const acc = accSnap.data();
      const s = acc.state || {};
      const newPoints = (typeof s.points === 'number' ? s.points : 0) - DUEL_CHEAT_PENALTY;
      tx.update(accRef, { 'state.points': newPoints });
    });
  }catch(e){ console.error('penalty deduction error:', e); }

  // لو أنا اللي اتعاقبت وده حسابي المحمّل حالياً، حدّث النسخة المحلية فوراً
  if(key === docId(currentUser) && state){
    state.points -= DUEL_CHEAT_PENALTY;
  }

  await maybeSettleDuel();
}

// كل لاعب يبعت إجابته على حسابه فقط. بعد آخر سؤال أو انتهاء الوقت، تُقفل مرحلته.
async function submitDuelAnswer(qOrderIdx, optionIdx){
  if(!duelData || duelData.status !== 'active') return;
  const key = docId(currentUser);
  const myProgress = duelData.progress[key];
  if(!myProgress || myProgress.finishedAt) return;

  const realQIdx = duelData.questionIndices[qOrderIdx];
  const question = DUEL_QUESTION_POOL[realQIdx];
  const isCorrect = optionIdx === question.correct;

  const newAnswers = [...myProgress.answers, { qOrderIdx, optionIdx, correct: isCorrect }];
  const newScore = myProgress.score + (isCorrect ? 1 : 0);
  const isLast = newAnswers.length >= duelData.questionIndices.length;

  const updates = {
    [`progress.${key}.answers`]: newAnswers,
    [`progress.${key}.score`]: newScore,
    [`progress.${key}.lastPing`]: Date.now()
  };
  if(isLast) updates[`progress.${key}.finishedAt`] = Date.now();

  await db.collection('duels').doc(duelId).update(updates);
  if(isLast) await maybeSettleDuel();
}

// لو نفد الوقت، تُقفل مرحلة اللاعب تلقائياً بإجاباته الحالية فقط (بدون عقوبة، فده وقت طبيعي مش خروج)
async function checkDuelFinishConditions(){
  if(!duelData || duelData.status !== 'active') return;
  const key = docId(currentUser);
  const myProgress = duelData.progress[key];
  if(myProgress && !myProgress.finishedAt && duelRemainingMs() <= 0){
    try{
      await db.collection('duels').doc(duelId).update({
        [`progress.${key}.finishedAt`]: Date.now()
      });
    }catch(e){}
  }
  await maybeSettleDuel();
}

// تُحسم المباراة لما اللاعبين الاتنين ينهوا مرحلتهم (سواء بإجابة كل الأسئلة، أو
// بانتهاء الوقت، أو بالانسحاب/الغش). التسوية تتم مرة واحدة فقط داخل Transaction.
async function maybeSettleDuel(){
  if(!duelId) return;
  const ref = db.collection('duels').doc(duelId);
  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if(!snap.exists) return;
      const d = snap.data();
      if(d.status !== 'active') return;
      const keys = Object.keys(d.progress);
      const bothDone = keys.every(k => !!d.progress[k].finishedAt);
      if(!bothDone) return;

      const [kA, kB] = keys;
      const scoreA = d.progress[kA].score, scoreB = d.progress[kB].score;
      let winnerKey = null, tie = false;
      if(scoreA === scoreB) tie = true;
      else winnerKey = scoreA > scoreB ? kA : kB;

      tx.update(ref, {
        status: 'completed',
        result: { winnerKey, tie, settledAt: Date.now() }
      });
    });

    // بعد التسوية، امنح نقاط الفوز (مرة واحدة، ينفّذها كل طرف على حسابه فقط لتفادي التعارض)
    const finalSnap = await ref.get();
    const fd = finalSnap.data();
    if(fd.status === 'completed' && fd.result){
      // مباراة عادية (مش جزء من بطولة) → نقاط فوز عادية 50
      if(!fd.tournamentRef && !fd.result.pointsAwarded){
        const myKey = docId(currentUser);
        if(fd.result.winnerKey === myKey){
          await awardDuelWinPoints(myKey);
          state.duelWins=(state.duelWins||0)+1; state.xp=(state.xp||0)+DUEL_WIN_POINTS;
          await saveState(currentUser,state).catch(()=>{});
          await ref.update({ 'result.pointsAwarded': true }).catch(()=>{});
        } else if(fd.result.winnerKey && fd.result.winnerKey !== myKey){
          state.duelLosses=(state.duelLosses||0)+1; await saveState(currentUser,state).catch(()=>{});
        }
      }
      // مباراة داخل بطولة → قدّم الفائز للدور التالي (بدون نقاط فوز عادية، الجوائز بالمراكز فقط)
      if(fd.tournamentRef){
        await propagateTournamentResult(fd);
      }
    }
  }catch(e){ console.error('settle duel error:', e); }
}

async function awardDuelWinPoints(myKey){
  try{
    await db.runTransaction(async (tx) => {
      const accRef = db.collection('accounts').doc(myKey);
      const accSnap = await tx.get(accRef);
      if(!accSnap.exists) return;
      const acc = accSnap.data();
      const s = acc.state || {};
      const newPoints = (typeof s.points === 'number' ? s.points : 0) + DUEL_WIN_POINTS;
      tx.update(accRef, { 'state.points': newPoints });
    });
    if(state) state.points += DUEL_WIN_POINTS;
  }catch(e){ console.error('award win points error:', e); }
}

function leaveDuelCleanup(){
  window.removeEventListener('beforeunload', duelExitHandler);

}

   ==================================================================
   Collection: tournaments/{tournamentId}
   بطولة إقصاء مباشر (Single Elimination) — كل مباراة داخل البطولة هي
   نفسها مستند duel عادي يُنشأ تلقائياً، فيستفيد من كل قواعد التحدي
   (نفس الأسئلة، الوقت، عقوبة الخروج) بدون تكرار المنطق.
   المراكز 1-4 تُحسب من نتيجة النهائي ومباراة تحديد المركز الثالث.
   ================================================================== */

function nextPowerOfTwo(n){
  let p = 1; while(p < n) p *= 2; return p;
}

// أدمن/أول لاعب يدخل الصفحة ينشئ البطولة لو مفيش بطولة مفتوحة حالياً
async function openOrJoinTournament(){
  errorMsg = '';
  try{
    const openSnap = await db.collection('tournaments')
      .where('status','in',['registration','ongoing']).limit(1).get();

    if(!openSnap.empty){
      const doc = openSnap.docs[0];
      tournamentId = doc.id;
      if(doc.data().status === 'registration'){
        await joinTournament(tournamentId);
      }
      listenToTournament(tournamentId);
      view = 'tournament'; render();
      return;
    }

    // مفيش بطولة مفتوحة → أنشئ واحدة جديدة وسجّل نفسي فيها
    const ref = await db.collection('tournaments').add({
      status: 'registration',
      participants: [currentUser],
      minPlayers: 4,
      bracket: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      prizesAwarded: false
    });
    tournamentId = ref.id;
    listenToTournament(tournamentId);
    view = 'tournament'; render();
  }catch(e){
    console.error('open tournament error:', e);
    errorMsg = 'تعذر فتح البطولة، حاول مرة أخرى.';
    render();
  }
}

async function joinTournament(id){
  if(isSuperAdmin()) return; // حساب المشرف لا ينضم للبطولات ولا يظهر فيها
  const ref = db.collection('tournaments').doc(id);
  await db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    if(!snap.exists) return;
    const d = snap.data();
    if(d.status !== 'registration') return;
    if(d.participants.includes(currentUser)) return;
    tx.update(ref, { participants: [...d.participants, currentUser] });
  });
}

function listenToTournament(id){
  if(tournamentUnsub) tournamentUnsub();
  tournamentUnsub = db.collection('tournaments').doc(id).onSnapshot((snap) => {
    if(!snap.exists){ tournamentData = null; render(); return; }
    tournamentData = snap.data();
    render();
  });
}

// أي لاعب مسجّل بالبطولة يقدر يضغط "ابدأ البطولة الآن" لو وصل العدد الأدنى للاعبين
async function startTournamentBracket(){
  if(!tournamentId || !tournamentData) return;
  const players = [...tournamentData.participants];
  if(players.length < (tournamentData.minPlayers || 4)) return;

  // اخلط اللاعبين عشوائياً، وأكمل بـ "استراحة" (bye) لأقرب قوة 2 لو العدد فردي/غير مكتمل
  for(let i = players.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [players[i], players[j]] = [players[j], players[i]];
  }
  const size = nextPowerOfTwo(players.length);
  while(players.length < size) players.push(null); // null = استراحة تلقائية (فوز بدون مباراة)

  const round1 = [];
  for(let i = 0; i < players.length; i += 2){
    round1.push({ p1: players[i], p2: players[i+1], duelId: null, winner: players[i+1] === null ? players[i] : null });
  }

  await db.collection('tournaments').doc(tournamentId).update({
    status: 'ongoing',
    bracket: [round1]
  });
}

// عند دخول لاعب لمباراة داخل البطولة: تُنشأ (أو تُستخدم) مباراة duel عادية لهذه المواجهة
async function enterTournamentMatch(roundIdx, matchIdx){
  const ref = db.collection('tournaments').doc(tournamentId);
  const newDuelId = await db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    const d = snap.data();
    const match = d.bracket[roundIdx][matchIdx];
    if(match.duelId) return match.duelId;
    if(!match.p1 || !match.p2) return null; // استراحة، مفيش مباراة تُلعب

    const questionIndices = pickRandomQuestionIndices(DUEL_QUESTIONS_COUNT);
    const duelRef = db.collection('duels').doc();
    tx.set(duelRef, {
      players: [match.p1, match.p2],
      questionIndices,
      status: 'active',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      startAt: firebase.firestore.FieldValue.serverTimestamp(),
      progress: {
        [docId(match.p1)]: freshDuelProgress(),
        [docId(match.p2)]: freshDuelProgress()
      },
      names: { [docId(match.p1)]: match.p1, [docId(match.p2)]: match.p2 },
      result: null,
      tournamentRef: { tournamentId, roundIdx, matchIdx }
    });
    const bracket = d.bracket;
    bracket[roundIdx][matchIdx].duelId = duelRef.id;
    tx.update(ref, { bracket });
    return duelRef.id;
  });

  if(newDuelId) await enterDuel(newDuelId);
}

// تُستدعى تلقائياً بعد تسوية أي duel مرتبط ببطولة، عشان تحدّث البطولة وتقدّم الفائز للدور التالي
async function propagateTournamentResult(finalDuelDoc){
  const ref0 = finalDuelDoc.tournamentRef;
  if(!ref0) return;
  const tRef = db.collection('tournaments').doc(ref0.tournamentId);
  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(tRef);
      if(!snap.exists) return;
      const d = snap.data();
      const match = d.bracket[ref0.roundIdx][ref0.matchIdx];
      if(match.winner) return; // اتسجل قبل كده

      const keys = Object.keys(finalDuelDoc.progress);
      const names = finalDuelDoc.names;
      let winnerName;
      if(finalDuelDoc.result.tie){
        // في حالة التعادل بالبطولة: الأفضلية لمن أنهى أولاً (finishedAt أصغر) كحاسم فاصل
        const [kA, kB] = keys;
        winnerName = finalDuelDoc.progress[kA].finishedAt <= finalDuelDoc.progress[kB].finishedAt ? names[kA] : names[kB];
      } else {
        winnerName = names[finalDuelDoc.result.winnerKey];
      }

      const bracket = d.bracket;
      bracket[ref0.roundIdx][ref0.matchIdx].winner = winnerName;

      // لو كل مباريات الدور الحالي خلصت، جهّز الدور التالي تلقائياً
      const round = bracket[ref0.roundIdx];
      const allDone = round.every(m => m.winner || (!m.p1 || !m.p2));
      if(allDone){
        if(round.length === 1){
          // ده كان النهائي → البطولة خلصت
          tx.update(tRef, { bracket, status: 'completed', champion: winnerName });
        } else {
          const winners = round.map(m => m.winner || (m.p1 && !m.p2 ? m.p1 : m.p2));
          const nextRound = [];
          for(let i = 0; i < winners.length; i += 2){
            nextRound.push({ p1: winners[i], p2: winners[i+1] || null, duelId: null, winner: !winners[i+1] ? winners[i] : null });
          }
          bracket.push(nextRound);
          tx.update(tRef, { bracket });
        }
      } else {
        tx.update(tRef, { bracket });
      }
    });
  }catch(e){ console.error('propagate tournament result error:', e); }

  await maybeAwardTournamentPrizes(ref0.tournamentId);
}

// توزيع جوائز المراكز الأربعة الأولى بمجرد اكتمال البطولة (مرة واحدة فقط)
async function maybeAwardTournamentPrizes(tId){
  const tRef = db.collection('tournaments').doc(tId);
  const snap = await tRef.get();
  if(!snap.exists) return;
  const d = snap.data();
  if(d.status !== 'completed' || d.prizesAwarded) return;

  const rounds = d.bracket;
  const finalRound = rounds[rounds.length - 1];
  const finalMatch = finalRound[0];
  const first = finalMatch.winner;
  const second = finalMatch.p1 === first ? finalMatch.p2 : finalMatch.p1;

  // المركزان 3 و4: من خاسرَي نصف النهائي (لو موجود دور نصف نهائي)
  let third = null, fourth = null;
  if(rounds.length >= 2){
    const semi = rounds[rounds.length - 2];
    const losers = semi.map(m => (m.winner === m.p1 ? m.p2 : m.p1)).filter(Boolean);
    third = losers[0] || null;
    fourth = losers[1] || null;
  }

  const winnersMap = {};
  if(first)  winnersMap[docId(first)]  = TOURNAMENT_PRIZES[1];
  if(second) winnersMap[docId(second)] = TOURNAMENT_PRIZES[2];
  if(third)  winnersMap[docId(third)]  = TOURNAMENT_PRIZES[3];
  if(fourth) winnersMap[docId(fourth)] = TOURNAMENT_PRIZES[4];

  // كل لاعب فايز يمنح نفسه جائزته بنفسه (حصراً) لتفادي أي تعارض كتابة على حسابات آخرين
  const myPrize = winnersMap[docId(currentUser)];
  if(myPrize){
    try{
      await db.runTransaction(async (tx) => {
        const accRef = db.collection('accounts').doc(docId(currentUser));
        const accSnap = await tx.get(accRef);
        if(!accSnap.exists) return;
        const acc = accSnap.data();
        const s = acc.state || {};
        const newPoints = (typeof s.points === 'number' ? s.points : 0) + myPrize;
        tx.update(accRef, { 'state.points': newPoints });
      });
      if(state) state.points += myPrize;
    }catch(e){ console.error('prize award error:', e); }
  }

  try{
    await tRef.update({ prizesAwarded: true, results: { first, second, third, fourth } });
  }catch(e){ /* ممكن لاعب تاني يكون سبقنا بنفس التحديث، مقبول */ }
}

function navigateToPage(target){
  if(target === 'quiz'){ ensureQuizDay(); quizAnswered=false; quizSelected=null; quizFeedback=''; quizCurrentIndex=null; }
  if(target === 'review'){ reviewAnswered=false; reviewSelected=null; reviewCurrentKey=null; }

  if(target === 'friends'){ friendsProfilesLoaded = false; }
  if(target === 'team'){ teamData = null; teamsLeaderboardData = null; teamViewMode = 'main'; }
  if(target === 'tournament'){ tournamentData = null; }
  if(target === 'chat'){ prevView = view; openChatView(); return; }
  if(view === 'chat' && target !== 'chat'){ closeChatView(); }

  prevView = view;
  view = target; render();
}

  view = target;

}

async function loadAdminData(){
  if(!isSuperAdmin()) return;
  try{
    const [accountsSnap, questionsSnap, tournamentsSnap, siteSnap, adsSnap, groupChatSnap, suggestionsSnap, localDuelSnap] = await Promise.all([
      db.collection('accounts').get(),
      db.collection('question_bank').get(),
      db.collection('tournaments').orderBy('createdAt','desc').limit(20).get().catch(()=>db.collection('tournaments').limit(20).get()),
      db.collection('settings').doc('site').get(),
      db.collection('ads').orderBy('createdAt','desc').get().catch(()=>db.collection('ads').get()),
      db.collection('group_chat').orderBy('createdAt','asc').limitToLast(300).get().catch(()=>db.collection('group_chat').get()),
      db.collection('question_suggestions').orderBy('createdAt','desc').limit(100).get().catch(()=>db.collection('question_suggestions').limit(100).get()),
      db.collection('local_1v1_matches').limit(100).get().catch(()=>({docs:[]}))
    ]);
    adminCache.accounts = accountsSnap.docs.map(d=>({id:d.id,...d.data()}));
    if(questionsSnap.empty && Array.isArray(RELIGIOUS_QUESTIONS_BANK) && RELIGIOUS_QUESTIONS_BANK.length){
      const batch = db.batch();
      RELIGIOUS_QUESTIONS_BANK.forEach((q,i)=>{
        const ref = db.collection('question_bank').doc();
        const level = Math.min(4, Math.floor(i / Math.max(1, Math.ceil(RELIGIOUS_QUESTIONS_BANK.length/4))) + 1);
        batch.set(ref,{q:q.q,options:q.options,correct:q.correct,level});
      });
      await batch.commit();
      adminCache.questions = RELIGIOUS_QUESTIONS_BANK.map((q,i)=>({id:'seed-'+i,...q,level:Math.min(4, Math.floor(i / Math.max(1, Math.ceil(RELIGIOUS_QUESTIONS_BANK.length/4))) + 1)}));
    } else {
      adminCache.questions = questionsSnap.docs.map(d=>({id:d.id,...d.data()}));
    }
    adminCache.tournaments = tournamentsSnap.docs.map(d=>({id:d.id,...d.data()}));
    adminCache.site = siteSnap.exists ? siteSnap.data() : {};
    adminCache.ads = adsSnap.docs.map(d=>({id:d.id,...d.data()}));
    adminCache.groupChat = groupChatSnap.docs.map(d=>({id:d.id,...d.data()}));
    adminCache.suggestions = suggestionsSnap.docs.map(d=>({id:d.id,...d.data()}));
    adminCache.localDuels = localDuelSnap && localDuelSnap.docs ? localDuelSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))) : [];
  }catch(e){
    console.error('admin load error',e);
  }
}

async function adminDeleteAllQuestions(){
  if(!isSuperAdmin()) return;
  if(!confirm('هل أنت متأكد من حذف جميع أسئلة بنك الأسئلة نهائياً؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  if(!confirm('تأكيد أخير: سيتم حذف كل الأسئلة المخزنة في قاعدة البيانات الآن. متابعة؟')) return;
  const btn=document.getElementById('btn-delete-all-questions');
  if(btn){ btn.disabled=true; btn.textContent='جارِ الحذف...'; }
  try{
    const snap = await db.collection('question_bank').get();
    const docs = snap.docs;
    const batchSize = 400; // أقل من حد Firestore (500) لكل دفعة
    for(let i = 0; i < docs.length; i += batchSize){
      const batch = db.batch();
      docs.slice(i, i + batchSize).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    await loadRuntimeQuestionBank(); await loadAdminData(); renderControlPanel();
    alert('تم حذف جميع الأسئلة بنجاح. رجع النظام مؤقتاً للبنك الافتراضي المدمج في التطبيق حتى ترفع أسئلة جديدة.');
  }catch(e){
    console.error('delete all questions error', e);
    alert('تعذر حذف كل الأسئلة. تأكد من صلاحيات Firestore (Rules) وحاول مرة أخرى.');
    if(btn){ btn.disabled=false; btn.textContent='🗑️ حذف جميع الأسئلة'; }
  }
}

async function adminUploadQuestionsFile(){
  if(!isSuperAdmin()) return;
  const fileInput=document.getElementById('admin-questions-file');
  const statusEl=document.getElementById('admin-questions-upload-status');
  const file=fileInput && fileInput.files && fileInput.files[0];
  if(!file){ alert('اختر ملف JSON أولاً'); return; }
  const btn=document.getElementById('btn-upload-questions');
  if(btn) btn.disabled=true;
  if(statusEl) statusEl.textContent='جارِ قراءة الملف...';
  try{
    const text=await file.text();
    let parsed;
    try{ parsed=JSON.parse(text); }catch(e){ throw new Error('الملف ليس JSON صالحاً'); }
    if(!Array.isArray(parsed)) throw new Error('الملف يجب أن يحتوي على مصفوفة أسئلة');
    const validQuestions=parsed.filter(item =>
      item && typeof item.q==='string' && item.q.trim() &&
      Array.isArray(item.options) && item.options.length>=2 &&
      typeof item.correct!=='undefined'
    ).map(item => ({
      q:item.q.trim(),
      options:item.options.map(o=>String(o)),
      correct:Math.max(0,Math.min(item.options.length-1,Number(item.correct)||0)),
      level:Math.min(4,Math.max(1,Number(item.level)||1))
    }));
    if(!validQuestions.length) throw new Error('لم يتم العثور على أسئلة صالحة في الملف');
    if(statusEl) statusEl.textContent=`جارِ إضافة ${validQuestions.length} سؤال...`;
    const CHUNK=450;
    for(let i=0;i<validQuestions.length;i+=CHUNK){
      const batch=db.batch();
      validQuestions.slice(i,i+CHUNK).forEach(item=>{
        const ref=db.collection('question_bank').doc();
        batch.set(ref,item);
      });
      await batch.commit();
    }
    if(statusEl) statusEl.textContent='';
    alert(`تمت إضافة ${validQuestions.length} سؤال بنجاح.`);
    fileInput.value='';
    await loadRuntimeQuestionBank(); await loadAdminData(); renderControlPanel();
  }catch(e){
    console.error('upload questions error',e);
    if(statusEl) statusEl.textContent='';
    alert('خطأ: '+e.message);
    if(btn) btn.disabled=false;
  }
}

async function handleLogin(){
  const u = document.getElementById('in-user').value.trim();
  const p = document.getElementById('in-pass').value;
  if(!u || !p){ errorMsg = 'من فضلك أدخل اسم المستخدم وكلمة المرور'; render(); return; }
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'جارِ الدخول...';
  try{
    const acc = await fetchAccount(u);
    if(!acc || acc.password !== p){ errorMsg = 'اسم المستخدم أو كلمة المرور غير صحيحة'; render(); return; }
    if(acc.banned){ errorMsg = 'هذا الحساب محظور من دخول التطبيق، تواصل مع الأدمن.'; render(); return; }
    currentUser = acc.username;
    state = ensureStateShape(acc.state || freshState());
    state.profileImageUrl = acc.profileImageUrl || state.profileImageUrl || '';
    errorMsg = '';
    logLoginEvent(currentUser);
    enterMain();
  }catch(e){
    console.error(e);
    errorMsg = 'تعذر الاتصال بقاعدة البيانات، تأكد من اتصالك بالإنترنت وحاول مرة أخرى';
    render();
  }
}

async function handleRegister(){
  const u = document.getElementById('in-user').value.trim();
  const p = document.getElementById('in-pass').value;
  if(!u || !p){ errorMsg = 'من فضلك أدخل اسم المستخدم وكلمة المرور'; render(); return; }
  if(u.length < 3){ errorMsg = 'اسم المستخدم يجب أن يكون 3 أحرف على الأقل'; render(); return; }
  if(p.length < 4){ errorMsg = 'كلمة المرور يجب أن تكون 4 أحرف على الأقل'; render(); return; }
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'جارِ الإنشاء...';
  try{
    const existing = await fetchAccount(u);
    if(existing){ errorMsg = 'اسم المستخدم موجود بالفعل، اختر اسماً آخر'; render(); return; }
    const acc = await createAccount(u, p);
    currentUser = acc.username;
    state = ensureStateShape(acc.state);
    state.profileImageUrl = acc.profileImageUrl || '';
    errorMsg = '';
    logLoginEvent(currentUser);
    enterMain();
  }catch(e){
    console.error(e);
    errorMsg = 'تعذر إنشاء الحساب، تأكد من اتصالك بالإنترنت وحاول مرة أخرى';
    render();
  }
}

// ===================== الورد اليومي (سور بالاسم، ونطاق آيات للسور الطويلة) =====================
function dailyWirdSegments(){
  // بيحدد كمية آيات مقترحة لليوم (بتتغيّر حسب يوم المستخدم عشان الورد يبقى متنوع)،
  // وبيترجمها لسور بالاسم مع نطاق آيات دقيق (خصوصاً للسور الطويلة اللي مش هتتقرأ كاملة في يوم واحد)
  const pace = [15,20,30,20,40,15,25];
  const target = pace[(state.day - 1) % pace.length];
  const cursor = state.wirdAyahCursor % TOTAL_AYAHS;
  const toConsume = Math.min(target, TOTAL_AYAHS - cursor);
  const segments = [];
  let pos = cursor, left = toConsume;
  while(left > 0){
    let acc = 0, idx = 0;
    for(idx = 0; idx < SURAHS.length; idx++){
      if(pos < acc + SURAHS[idx].ayahs) break;
      acc += SURAHS[idx].ayahs;
    }
    const surah = SURAHS[idx];
    const fromAyah = pos - acc + 1;
    const availableInSurah = surah.ayahs - (fromAyah - 1);
    const take = Math.min(left, availableInSurah);
    const toAyah = fromAyah + take - 1;
    segments.push({name: surah.name, from: fromAyah, to: toAyah, fullLength: surah.ayahs});
    pos += take;
    left -= take;
  }
  return {segments, consumed: toConsume};
}
function dailyWirdSegmentLabel(seg){
  if(seg.from === 1 && seg.to === seg.fullLength) return `سورة ${seg.name} كاملة`;
  return `سورة ${seg.name} من الآية ${seg.from} إلى الآية ${seg.to}`;
}
function dailyWirdWidgetHtml(){
  const {segments} = dailyWirdSegments();
  const done = state.wirdLastDoneDay === state.day;
  const cursor = state.wirdAyahCursor % TOTAL_AYAHS;
  const pct = Math.round((cursor / TOTAL_AYAHS) * 100);
  const listHtml = segments.map(seg => `<li>${dailyWirdSegmentLabel(seg)}</li>`).join('');
  return `<div class="card prayer-card">
    <h2>📖 وردك اليومي</h2>
    <div class="hint" style="margin:0 0 10px;">ورد اليوم المقترح:</div>
    <ul style="margin:0 0 10px;padding-inline-start:20px;color:var(--gold-light);font-weight:700;text-align:right;">${listHtml}</ul>
    <div class="hint" style="margin:0 0 10px;">تقدّمك في الختمة الحالية: ${cursor} / ${TOTAL_AYAHS} آية (${pct}%)</div>
    <button class="btn" id="btn-wird-done" style="margin:0;${done?'background:transparent;border:1px solid var(--ok);color:var(--ok);':''}" ${done?'disabled':''}>${done ? '✓ تمت قراءته' : 'قرأته الحمد لله ✅'}</button>
  </div>`;
}

function buildWheelSVG(){
  const n = WHEEL_SEGMENTS.length;
  const segAngle = 360 / n;
  const cx = 100, cy = 100, r = 95;
  const toXY = (angleDeg, radius) => {
    const rad = (Math.PI/180) * angleDeg;
    return [cx + radius*Math.sin(rad), cy - radius*Math.cos(rad)];
  };
  let paths = '';
  WHEEL_SEGMENTS.forEach((s, i) => {
    const startA = i * segAngle, endA = (i+1) * segAngle, midA = startA + segAngle/2;
    const [x1,y1] = toXY(startA, r);
    const [x2,y2] = toXY(endA, r);
    const [tx,ty] = toXY(midA, 64);
    const textRot = (midA > 90 && midA < 270) ? midA + 180 : midA;
    paths += `<path d="M ${cx},${cy} L ${x1.toFixed(2)},${y1.toFixed(2)} A ${r},${r} 0 0,1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${s.color}" stroke="#fdf6f0" stroke-width="1" stroke-opacity="0.15"/>`;
    paths += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="${s.value===100?'#fdf6f0':'#ffb199'}" font-size="${s.value===100?'16':'13'}" font-weight="800" text-anchor="middle" dominant-baseline="middle" font-family="Cairo, sans-serif" transform="rotate(${textRot.toFixed(2)},${tx.toFixed(2)},${ty.toFixed(2)})">${s.value}</text>`;
  });
  return `
    <svg viewBox="0 0 200 200" width="230" height="230">
      <circle cx="100" cy="100" r="97" fill="none" stroke="#ff8a5c" stroke-width="3"/>
      <g id="wheel-group" class="wheel-group">${paths}</g>
      <circle cx="100" cy="100" r="11" fill="#ff8a5c" stroke="#fdf6f0" stroke-width="2"/>
    </svg>
  `;
}

function pickWeightedWheelIndex(){
  const total = WHEEL_SEGMENTS.reduce((a,s) => a + s.weight, 0);
  let r = Math.random() * total;
  for(let i=0; i<WHEEL_SEGMENTS.length; i++){
    if(r < WHEEL_SEGMENTS[i].weight) return i;
    r -= WHEEL_SEGMENTS[i].weight;
  }
  return WHEEL_SEGMENTS.length - 1;
}

function spinWheel(){
  if(wheelSpinning) return;
  if(state.wheelNextSpinAt && Date.now() < state.wheelNextSpinAt) return;

  wheelSpinning = true;
  wheelLastWin = null;
  const btn = document.getElementById('btn-spin-wheel');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ اللف...'; }

  const idx = pickWeightedWheelIndex();
  const n = WHEEL_SEGMENTS.length;
  const segAngle = 360 / n;
  const targetMid = idx * segAngle + segAngle/2;
  const extraSpins = 5;
  const rotation = extraSpins * 360 + ((360 - targetMid) % 360);

  const groupEl = document.getElementById('wheel-group');
  if(groupEl){
    groupEl.style.transform = 'rotate(0deg)';
    void groupEl.offsetWidth; // إجبار إعادة الرسم قبل تطبيق التدوير الجديد
    groupEl.style.transform = `rotate(${rotation}deg)`;
  }

  setTimeout(() => {
    const won = WHEEL_SEGMENTS[idx].value;
    state.points += won;
    state.xp += won;
    state.wheelWins = (state.wheelWins || 0) + 1;
    state.wheelNextSpinAt = Date.now() + WHEEL_SPIN_COOLDOWN_MS;
    wheelSpinning = false;
    wheelLastWin = won;
    persist();
    render();
  }, 4300);
}

const LEADERBOARD_LEVEL_ORDER = ['مبتدئ','متقدم','محترف','خبير','أسطورة'];
async function loadLeaderboard(){
  leaderboardLoading = true;
  try{
    const snap = await db.collection('accounts').get();
    const rows = [];
    snap.forEach(doc => {
      const d = doc.data();
      if((d.username || doc.id) === SUPER_ADMIN_USERNAME) return; // إخفاء حساب المشرف من الترتيب نهائياً
      const s = d.state || {};
      const xp = typeof s.xp === 'number' ? s.xp : 0;
      const li = getLevelInfo(xp);
      rows.push({
        username: d.username || doc.id,
        points: typeof s.points === 'number' ? s.points : 0,
        correctAnswers: typeof s.correctAnswers === 'number' ? s.correctAnswers : 0,
        xp,
        levelName: li.name,
        levelIcon: li.icon,
        levelRank: LEADERBOARD_LEVEL_ORDER.indexOf(li.name)
      });
    });
    // الترتيب أساساً حسب المستوى، وعند تساوي المستوى يتم الفصل حسب XP ثم الإجابات الصحيحة
    rows.sort((a,b) => b.levelRank - a.levelRank || b.xp - a.xp || b.correctAnswers - a.correctAnswers);
    leaderboardData = rows;
  }catch(e){
    console.error(e);
    leaderboardData = [];
  }
  leaderboardLoading = false;
  if(view === 'leaderboard') render();
}

// ===================== مشاركة بطاقة الإنجاز كصورة =====================
function loadImageEl(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('تعذر تحميل الصورة'));
    img.src = src;
  });
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
async function generateAchievementCardBlob(){
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  const w = 800, h = 1000;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  const bg = ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#1a1035'); bg.addColorStop(1,'#241750');
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = '#ff8a5c'; ctx.lineWidth = 5;
  roundRectPath(ctx, 24, 24, w-48, h-48, 26); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,138,92,0.35)'; ctx.lineWidth = 1.5;
  roundRectPath(ctx, 38, 38, w-76, h-76, 20); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff8a5c';
  ctx.font = '26px Cairo, sans-serif';
  ctx.fillText('۞ رفيق طالب ۞', w/2, 95);

  try{
    const avatarImg = await loadImageEl(getProfileImage());
    ctx.save();
    ctx.beginPath(); ctx.arc(w/2, 250, 100, 0, Math.PI*2); ctx.closePath(); ctx.clip();
    ctx.drawImage(avatarImg, w/2-100, 250-100, 200, 200);
    ctx.restore();
  }catch(e){}
  ctx.strokeStyle = '#ff8a5c'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(w/2, 250, 100, 0, Math.PI*2); ctx.stroke();

  ctx.fillStyle = '#ffb199';
  ctx.font = 'bold 38px Cairo, sans-serif';
  ctx.fillText(currentUser, w/2, 400);

  const li = getLevelInfo(state.xp);
  ctx.fillStyle = '#ff8a5c';
  ctx.font = '28px Cairo, sans-serif';
  ctx.fillText(`${li.icon} المستوى: ${li.name}`, w/2, 445);

  const stats = [
    ['✨', `${state.xp}`, 'XP'],
    ['✅', `${state.correctAnswers||0}`, 'إجابة صحيحة'],
    ['🔥', `${(state.streak&&state.streak.count)||0}`, 'يوم متتالي']
  ];
  const boxW = 210, boxH = 130, gap = 20, startX = (w - (boxW*3+gap*2))/2, boxY = 500;
  stats.forEach((s,i) => {
    const x = startX + i*(boxW+gap);
    ctx.strokeStyle = 'rgba(255,138,92,0.4)'; ctx.lineWidth = 1.5;
    roundRectPath(ctx, x, boxY, boxW, boxH, 16); ctx.stroke();
    ctx.fillStyle = 'rgba(253,246,240,0.04)'; roundRectPath(ctx, x, boxY, boxW, boxH, 16); ctx.fill();
    ctx.font = '34px Cairo, sans-serif'; ctx.fillStyle = '#ffb199';
    ctx.fillText(s[0], x+boxW/2, boxY+48);
    ctx.font = 'bold 30px Cairo, sans-serif';
    ctx.fillText(s[1], x+boxW/2, boxY+84);
    ctx.font = '15px Cairo, sans-serif'; ctx.fillStyle = '#c7b8e0';
    ctx.fillText(s[2], x+boxW/2, boxY+110);
  });

  const earnedBadges = BADGE_DEFS.filter(b => state.badges && state.badges[b.id]);
  ctx.fillStyle = '#ff8a5c'; ctx.font = '20px Cairo, sans-serif';
  ctx.fillText(`🎖️ الأوسمة المكتسبة: ${earnedBadges.length} / ${BADGE_DEFS.length}`, w/2, 690);
  if(earnedBadges.length){
    const iconsRow = earnedBadges.slice(0,7).map(b=>b.icon).join('   ');
    ctx.font = '40px Cairo, sans-serif';
    ctx.fillText(iconsRow, w/2, 745);
  }

  ctx.fillStyle = '#c7b8e0'; ctx.font = '16px Cairo, sans-serif';
  ctx.fillText('انضم إليّ في رحلة القرآن والعلم النافع 🌙', w/2, h-70);

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}
async function shareAchievement(){
  const btn = document.getElementById('btn-share-achievement');
  const setBtn = (txt, disabled) => { if(btn){ btn.textContent = txt; btn.disabled = disabled; } };
  setBtn('جارِ تجهيز البطاقة...', true);
  try{
    const blob = await generateAchievementCardBlob();
    if(!blob) throw new Error('فشل إنشاء الصورة');
    const fileName = 'إنجازي-رفيق-طالب.png';
    const file = (typeof File !== 'undefined') ? new File([blob], fileName, {type:'image/png'}) : null;
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'إنجازي في رفيق طالب', text:`وصلت إلى مستوى ${getLevelInfo(state.xp).name} 🎉 انضم إليّ!` });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
      alert('تم تحميل بطاقة إنجازك 📥 يمكنك الآن مشاركتها على واتساب أو إنستجرام.');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){ console.error(e); alert('تعذر إنشاء بطاقة الإنجاز، حاول مرة أخرى.'); }
  }finally{
    setBtn('🖼️ شارك إنجازك', false);
  }
}

function listenFriendRequests(){
  if(friendRequestsUnsub || !currentUser) return;
  friendRequestsUnsub = db.collection('friend_requests')
    .where('to','==',currentUser).where('status','==','pending')
    .onSnapshot(snap => {
      friendRequestsIncoming = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if(view === 'friends') render();
    }, e => console.warn('friend requests listen error', e));
}
async function sendFriendRequest(usernameRaw){
  const friend = (usernameRaw||'').trim();
  friendAddError = '';
  if(!friend || docId(friend)===docId(currentUser)){ friendAddError='اكتب اسم مستخدم صحيح.'; renderFriends(); return; }
  if((state.friends||[]).some(f=>docId(f)===docId(friend))){ friendAddError='هو بالفعل في قائمة أصدقائك.'; renderFriends(); return; }
  try{
    const acc = await fetchAccount(friend);
    if(!acc){ friendAddError='لا يوجد مستخدم بهذا الاسم.'; renderFriends(); return; }
    if(acc.banned){ friendAddError='هذا الحساب محظور.'; renderFriends(); return; }
    const existing = await db.collection('friend_requests')
      .where('from','==',currentUser).where('to','==',acc.username).where('status','==','pending').get();
    if(!existing.empty){ friendAddError='تم إرسال طلب من قبل، بانتظار الرد.'; renderFriends(); return; }
    await db.collection('friend_requests').add({from:currentUser, to:acc.username, status:'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    friendAddError = '';
    alert('تم إرسال طلب صداقة إلى '+acc.username+' 🤝');
    renderFriends();
  }catch(e){ console.error(e); friendAddError='تعذّر إرسال الطلب، حاول مرة أخرى.'; renderFriends(); }
}
async function acceptFriendRequest(id, fromUsername){
  try{
    const batch = db.batch();
    batch.update(db.collection('accounts').doc(docId(fromUsername)), {'state.friends': firebase.firestore.FieldValue.arrayUnion(currentUser)});
    batch.update(db.collection('accounts').doc(docId(currentUser)), {'state.friends': firebase.firestore.FieldValue.arrayUnion(fromUsername)});
    batch.update(db.collection('friend_requests').doc(id), {status:'accepted'});
    await batch.commit();
    if(!Array.isArray(state.friends)) state.friends = [];
    if(!state.friends.some(f=>docId(f)===docId(fromUsername))) state.friends.push(fromUsername);
    friendsProfilesLoaded = false;
    render();
  }catch(e){ console.error(e); alert('تعذّر قبول الطلب، حاول مرة أخرى.'); }
}
async function rejectFriendRequest(id){
  try{ await db.collection('friend_requests').doc(id).update({status:'rejected'}); }
  catch(e){ console.error(e); }
}
async function removeFriend(friendUsername){
  if(!confirm('إزالة '+friendUsername+' من قائمة الأصدقاء؟')) return;
  try{
    const batch = db.batch();
    batch.update(db.collection('accounts').doc(docId(currentUser)), {'state.friends': firebase.firestore.FieldValue.arrayRemove(friendUsername)});
    batch.update(db.collection('accounts').doc(docId(friendUsername)), {'state.friends': firebase.firestore.FieldValue.arrayRemove(currentUser)});
    await batch.commit();
    state.friends = (state.friends||[]).filter(f=>docId(f)!==docId(friendUsername));
    delete friendsProfilesCache[friendUsername];
    render();
  }catch(e){ console.error(e); alert('تعذّر إزالة الصديق، حاول مرة أخرى.'); }
}
async function loadFriendsProfiles(){
  friendsProfilesLoading = true;
  const list = state.friends || [];
  try{
    const results = await Promise.all(list.map(u => fetchAccount(u).catch(()=>null)));
    const cache = {};
    list.forEach((u,i) => { if(results[i]) cache[u] = results[i]; });
    friendsProfilesCache = cache;
  }catch(e){ console.error(e); }
  friendsProfilesLoading = false;
  if(view === 'friends') render();
}

function generateTeamCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
async function createTeam(nameRaw){
  const name = (nameRaw||'').trim();
  teamFormError = '';
  if(!name){ teamFormError='اكتب اسم الفريق.'; renderTeam(); return; }
  if(state.teamId){ teamFormError='أنت بالفعل عضو في فريق.'; renderTeam(); return; }
  try{
    const code = generateTeamCode();
    const ref = await db.collection('teams').add({
      name, code, ownerUsername: currentUser, members:[currentUser],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    state.teamId = ref.id;
    await persist();
    teamViewMode = 'main'; teamData = null;
    render();
  }catch(e){ console.error(e); teamFormError='تعذّر إنشاء الفريق، حاول مرة أخرى.'; renderTeam(); }
}
async function joinTeamByCode(codeRaw){
  const code = (codeRaw||'').trim().toUpperCase();
  teamFormError = '';
  if(!code){ teamFormError='اكتب كود الفريق.'; renderTeam(); return; }
  if(state.teamId){ teamFormError='أنت بالفعل عضو في فريق.'; renderTeam(); return; }
  try{
    const snap = await db.collection('teams').where('code','==',code).limit(1).get();
    if(snap.empty){ teamFormError='لا يوجد فريق بهذا الكود.'; renderTeam(); return; }
    const doc = snap.docs[0];
    if((doc.data().members||[]).length >= 30){ teamFormError='هذا الفريق ممتلئ.'; renderTeam(); return; }
    await doc.ref.update({members: firebase.firestore.FieldValue.arrayUnion(currentUser)});
    state.teamId = doc.id;
    await persist();
    teamViewMode = 'main'; teamData = null;
    render();
  }catch(e){ console.error(e); teamFormError='تعذّر الانضمام، حاول مرة أخرى.'; renderTeam(); }
}
async function leaveTeam(){
  if(!state.teamId) return;
  if(!confirm('هل تريد مغادرة الفريق؟')) return;
  try{
    await db.collection('teams').doc(state.teamId).update({members: firebase.firestore.FieldValue.arrayRemove(currentUser)});
    state.teamId = null;
    await persist();
    teamData = null; teamMembersProfiles = [];
    render();
  }catch(e){ console.error(e); alert('تعذّر مغادرة الفريق، حاول مرة أخرى.'); }
}
async function loadTeamData(){
  teamDataLoading = true;
  try{
    const doc = await db.collection('teams').doc(state.teamId).get();
    if(!doc.exists){
      state.teamId = null; await persist();
      teamData = null;
    } else {
      teamData = {id:doc.id, ...doc.data()};
      const members = teamData.members || [];
      const profiles = await Promise.all(members.map(u => fetchAccount(u).catch(()=>null)));
      teamMembersProfiles = members.map((u,i)=>({username:u, acc:profiles[i]})).filter(p=>p.acc);
      teamMembersProfiles.sort((a,b)=> ((b.acc.state&&b.acc.state.xp)||0) - ((a.acc.state&&a.acc.state.xp)||0));
    }
  }catch(e){ console.error(e); teamData = null; }
  teamDataLoading = false;
  if(view === 'team') render();
}
async function loadTeamsLeaderboard(){
  teamsLeaderboardLoading = true;
  try{
    const snap = await db.collection('teams').get();
    const rows = [];
    for(const doc of snap.docs){
      const d = doc.data();
      const members = d.members || [];
      if(!members.length) continue;
      const profiles = await Promise.all(members.map(u => fetchAccount(u).catch(()=>null)));
      const totalXp = profiles.reduce((sum,p) => sum + ((p && p.state && p.state.xp) || 0), 0);
      rows.push({id:doc.id, name:d.name, membersCount:members.length, totalXp});
    }
    rows.sort((a,b) => b.totalXp - a.totalXp);
    teamsLeaderboardData = rows;
  }catch(e){ console.error(e); teamsLeaderboardData = []; }
  teamsLeaderboardLoading = false;
  if(view === 'team') render();
}
function teamMemberRowHtml(p){
  const s = ensureStateShape({...p.acc.state});
  const li = getLevelInfo(s.xp);

  return `
    <div class="rank-item ${docId(p.username)===docId(currentUser)?'me':''}">
      <div class="rank-left">
        <img class="top-avatar" src="${img}" alt="صورة ${p.username}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;">
        <span class="rank-name">${p.username}${docId(p.username)===docId(currentUser)?' (أنت)':''}</span>
      </div>
      <div class="rank-stats">${li.icon} ${li.name} | <b>${s.xp}</b> XP</div>
    </div>`;
}

    <div class="card">

async function acceptFriendInvite(id,from){
  const q=pickRandomQuestionIndices(DUEL_QUESTIONS_COUNT), duelRef=db.collection('duels').doc();
  await db.runTransaction(async tx=>{
    const invRef=db.collection('friend_challenges').doc(id), snap=await tx.get(invRef); if(!snap.exists||snap.data().status!=='pending')return;
    tx.set(duelRef,{players:[from,currentUser],questionIndices:q,status:'active',createdAt:firebase.firestore.FieldValue.serverTimestamp(),startAt:firebase.firestore.FieldValue.serverTimestamp(),progress:{[docId(from)]:freshDuelProgress(),[docId(currentUser)]:freshDuelProgress()},names:{[docId(from)]:from,[docId(currentUser)]:currentUser},result:null,friendDuel:true});
    tx.update(invRef,{status:'accepted',duelId:duelRef.id});
  });
  const snap=await db.collection('friend_challenges').doc(id).get(); if(snap.exists&&snap.data().duelId) await enterDuel(snap.data().duelId);
}
function listenFriendInvites(){
  if(friendInviteUnsub||!currentUser)return; friendInviteUnsub=db.collection('friend_challenges').where('to','==',currentUser).where('status','==','pending').onSnapshot(()=>{if(view==='duel')renderDuelLobby();});
}
