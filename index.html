function renderDuelMatch(){
  if(!duelData){
    root.innerHTML = `<div class="loading">جارِ تجهيز المباراة...</div>`;
    return;
  }
  const myKey = docId(currentUser);
  const oppKey = Object.keys(duelData.progress).find(k => k !== myKey);
  const me = duelData.progress[myKey];
  const opp = duelData.progress[oppKey];
  const oppName = duelData.names ? duelData.names[oppKey] : oppKey;
  const remainingMs = duelRemainingMs();
  const remainingSec = Math.ceil(remainingMs/1000);
  const timerCls = remainingSec <= 30 && duelData.status==='active' ? 'duel-timer low' : 'duel-timer';

  if(duelData.status === 'completed'){
    const iWon = duelData.result.winnerKey === myKey;
    const tie = duelData.result.tie;
    const emoji = tie ? '🤝' : (iWon ? '🏆' : '💔');
    const title = tie ? 'تعادل!' : (iWon ? 'مبروك! فزت بالتحدي' : 'خسرت هذه الجولة');
    root.innerHTML = `
      <div class="card">
        <div class="duel-result">
          <div class="big-emoji">${emoji}</div>
          <h3>${title}</h3>
          <div class="vs-row">
            <div class="vs-side me"><div class="name">👤 أنت</div><div class="score">${me.score}/${duelData.questionIndices.length}</div>${me.disconnected?'<div class="flag">خرجت من المباراة (-'+DUEL_CHEAT_PENALTY+')</div>':''}</div>
            <div class="vs-mid">VS</div>
            <div class="vs-side"><div class="name">👤 ${oppName}</div><div class="score">${opp.score}/${duelData.questionIndices.length}</div>${opp.disconnected?'<div class="flag">انسحب/خرج (-'+DUEL_CHEAT_PENALTY+')</div>':''}</div>
          </div>
          ${iWon ? `<div class="points-line">+${DUEL_WIN_POINTS} نقطة فوز 🎉</div>` : ''}
          ${me.disconnected ? `<div class="points-line neg">-${DUEL_CHEAT_PENALTY} نقطة عقوبة خروج</div>` : ''}
          <button class="btn" id="btn-back-lobby">رجوع لصفحة دعوة الصديق</button>
        </div>
      </div>
    `;
    const backBtn = document.getElementById('btn-back-lobby');
    if(backBtn) backBtn.onclick = () => {
      const wasTournament = duelData.tournamentRef;
      leaveDuelCleanup();
      if(wasTournament && tournamentId){ view = 'tournament'; render(); listenToTournament(tournamentId); }
      else { view = 'duel'; render(); }
      refreshMyState();
    };
    return;
  }

  if(remainingMs <= 0 && !me.finishedAt){
    checkDuelFinishConditions();
  }

  const qOrderIdx = me.answers.length;
  const finishedWaiting = !!me.finishedAt;

  let bodyHtml;
  if(finishedWaiting){
    bodyHtml = `
      <div class="locked-note">
        أنهيت أسئلتك! (${me.score}/${duelData.questionIndices.length} إجابة صحيحة)<br>
        بننتظر ${oppName} ينهي مباراته...
      </div>
    `;
  } else {
    const realQIdx = duelData.questionIndices[qOrderIdx];
    const question = DUEL_QUESTION_POOL[realQIdx];
    bodyHtml = `
      <div class="duel-progress">السؤال ${qOrderIdx+1} من ${duelData.questionIndices.length}</div>
      <div class="quiz-q">${question.q}</div>
      ${question.options.map((opt,i) => {
        let cls = 'quiz-opt';
        if(duelAnswered){
          if(i === question.correct) cls += ' correct';
          else if(i === duelSelected) cls += ' wrong';
        }
        return `<button class="${cls}" data-opt="${i}" ${duelAnswered?'disabled':''}>${opt}</button>`;
      }).join('')}
      <div class="quiz-feedback ${duelFeedback==='ok'?'ok':duelFeedback==='err'?'err':''}">
        ${duelFeedback==='ok' ? 'إجابة صحيحة! ✅' : duelFeedback==='err' ? 'إجابة غير صحيحة ❌' : ''}
      </div>
    `;
  }

  root.innerHTML = `
    <div class="card">
      <h2>⚔️ التحدي جارٍ</h2>
      <div class="${timerCls}">${fmtCountdown(remainingMs).slice(3)}</div>
      <div class="vs-row">
        <div class="vs-side me"><div class="name">👤 أنت</div><div class="stat">${me.answers.length}/${duelData.questionIndices.length} أُجيب</div></div>
        <div class="vs-mid">VS</div>
        <div class="vs-side ${opp.disconnected?'disconnected':''}"><div class="name">👤 ${oppName}</div><div class="stat">${opp.disconnected?'خرج من المباراة':opp.answers.length+'/'+duelData.questionIndices.length+' أُجيب'}</div></div>
      </div>
      ${bodyHtml}
      <button class="btn" id="btn-surrender" style="background:transparent;border:1px solid var(--danger);color:var(--danger);">🚪 الانسحاب من المباراة (خصم ${DUEL_CHEAT_PENALTY} نقطة)</button>
    </div>
  `;

  if(!finishedWaiting && !duelAnswered){
    document.querySelectorAll('[data-opt]').forEach(btn => {
      btn.onclick = async () => {
        const i = parseInt(btn.getAttribute('data-opt'));
        duelSelected = i;
        duelAnswered = true;
        const realQIdx = duelData.questionIndices[qOrderIdx];
        duelFeedback = (i === DUEL_QUESTION_POOL[realQIdx].correct) ? 'ok' : 'err';
        render();
        await submitDuelAnswer(qOrderIdx, i);
        setTimeout(() => { duelAnswered = false; duelSelected = null; duelFeedback = ''; render(); }, 900);
      };
    });
  }
  const surrenderBtn = document.getElementById('btn-surrender');
  if(surrenderBtn) surrenderBtn.onclick = async () => {
    if(confirm('هل أنت متأكد؟ سيتم قفل مرحلتك وخصم ' + DUEL_CHEAT_PENALTY + ' نقطة.')){
      await applyDuelDisconnectPenalty(currentUser, 'surrender');
    }
  };
}

function renderTournament(){
  if(!tournamentId || !tournamentData){
    if(!tournamentId){
      root.innerHTML = `
        ${topNavHtml('tournament')}
        <div class="card">
          <h2>🏅 بطولة رفيق طالب</h2>
          <div class="locked-note" style="margin-top:0;">
            بطولة إقصاء مباشر بين الطلاب. المراكز الأربعة الأولى تحصل على جوائز نقاط كبيرة.
          </div>
          <div class="prize-list">
            <div class="prize-item">🥇 المركز الأول <b>${TOURNAMENT_PRIZES[1]} نقطة</b></div>
            <div class="prize-item">🥈 المركز الثاني <b>${TOURNAMENT_PRIZES[2]} نقطة</b></div>
            <div class="prize-item">🥉 المركز الثالث <b>${TOURNAMENT_PRIZES[3]} نقطة</b></div>
            <div class="prize-item">🏅 المركز الرابع <b>${TOURNAMENT_PRIZES[4]} نقطة</b></div>
          </div>
          <button class="btn" id="btn-open-tournament">دخول / الانضمام للبطولة الحالية</button>
          <div class="error">${errorMsg}</div>
        </div>
      `;
      updateSyncBadge(); bindTopNav();
      document.getElementById('btn-open-tournament').onclick = openOrJoinTournament;
      return;
    }
    root.innerHTML = `<div class="loading">جارِ تحميل البطولة...</div>`;
    return;
  }

  const d = tournamentData;
  const iAmIn = d.participants.includes(currentUser);

  if(d.status === 'registration'){
    root.innerHTML = `
      ${topNavHtml('tournament')}
      <div class="card">
        <h2>🏅 التسجيل مفتوح</h2>
        <div class="locked-note" style="margin-top:0;">عدد المسجلين: ${d.participants.length} (الحد الأدنى للبدء: ${d.minPlayers})</div>
        ${d.participants.map(p => `<div class="rank-item ${p===currentUser?'me':''}"><span class="rank-name">👤 ${p}</span></div>`).join('')}
        ${!iAmIn && !isSuperAdmin() ? `<button class="btn" id="btn-join-t">انضم للبطولة</button>` : ''}
        ${iAmIn && d.participants.length >= d.minPlayers ? `<button class="btn" id="btn-start-t">🚀 ابدأ البطولة الآن</button>` : ''}
      </div>
    `;
    updateSyncBadge(); bindTopNav();
    const joinBtn = document.getElementById('btn-join-t');
    if(joinBtn) joinBtn.onclick = async () => { await joinTournament(tournamentId); };
    const startBtn = document.getElementById('btn-start-t');
    if(startBtn) startBtn.onclick = startTournamentBracket;
    return;
  }

  // ongoing / completed → اعرض الشجرة (bracket)
  const roundNames = (total, idx) => {
    const remaining = total - idx;
    if(remaining === 1) return 'النهائي';
    if(remaining === 2) return 'نصف النهائي';
    if(remaining === 3) return 'ربع النهائي';
    return `الدور ${idx+1}`;
  };

  const bracketHtml = d.bracket.map((round, ri) => `
    <div class="bracket-round">
      <div class="bracket-round-title">${roundNames(d.bracket.length, ri)}</div>
      ${round.map((m, mi) => {
        if(!m.p2) return `<div class="bracket-match"><span class="bp win">${m.p1} (استراحة)</span></div>`;
        const canPlay = d.status==='ongoing' && !m.winner && (m.p1===currentUser || m.p2===currentUser);
        return `
          <div class="bracket-match">
            <span class="bp ${m.winner===m.p1?'win':(m.winner?'pending':'')}">${m.p1}</span>
            <span style="color:var(--text-dim);">vs</span>
            <span class="bp ${m.winner===m.p2?'win':(m.winner?'pending':'')}">${m.p2}</span>
            ${canPlay ? `<button class="btn-buy" data-play="${ri}:${mi}">العب</button>` : (m.winner ? '' : '<span class="hint">بانتظار اللاعبين</span>')}
          </div>
        `;
      }).join('')}
    </div>
  `).join('');

  root.innerHTML = `
    ${topNavHtml('tournament')}
    <div class="card">
      <h2>🏅 بطولة رفيق طالب</h2>
      ${d.status==='completed' ? `<div class="locked-note" style="margin-top:0;">🎉 انتهت البطولة! البطل: <b style="color:var(--gold-light)">${d.champion}</b></div>` : ''}
      ${bracketHtml}
      ${d.status==='completed' && d.results ? `
        <div class="prize-list">
          ${d.results.first  ? `<div class="prize-item">🥇 ${d.results.first} <b>${TOURNAMENT_PRIZES[1]}</b></div>` : ''}
          ${d.results.second ? `<div class="prize-item">🥈 ${d.results.second} <b>${TOURNAMENT_PRIZES[2]}</b></div>` : ''}
          ${d.results.third  ? `<div class="prize-item">🥉 ${d.results.third} <b>${TOURNAMENT_PRIZES[3]}</b></div>` : ''}
          ${d.results.fourth ? `<div class="prize-item">🏅 ${d.results.fourth} <b>${TOURNAMENT_PRIZES[4]}</b></div>` : ''}
        </div>
      ` : ''}
    </div>
  `;
  updateSyncBadge(); bindTopNav();
  document.querySelectorAll('[data-play]').forEach(btn => {
    btn.onclick = () => {
      const [ri, mi] = btn.getAttribute('data-play').split(':').map(Number);
      enterTournamentMatch(ri, mi);
    };
  });
}



/* ==================================================================
   ============ بطولة التحدي 1v1 المخصصة للأدمن — Firestore =========
   ==================================================================
   كل مباراة لها مستند مستقل داخل local_1v1_matches، لذلك يستطيع
   الأدمن إنشاء عدد كبير من الجولات والمباريات في نفس الوقت.
*/
const LOCAL_1V1_STORAGE_KEY = 'rafiq_local_1v1_match_cache_v3';
const LOCAL_1V1_COLLECTION = 'local_1v1_matches';
const LOCAL_1V1_TIME_MS = 5 * 60 * 1000;
const LOCAL_1V1_QUESTIONS = (typeof RELIGIOUS_QUESTIONS_BANK !== 'undefined' && RELIGIOUS_QUESTIONS_BANK.length >= 10)
  ? RELIGIOUS_QUESTIONS_BANK.slice(0,10).map(q=>({q:q.q,options:q.options.slice(0,3),correct:Number(q.correct)||0}))
  : DUEL_QUESTION_POOL.slice(0,10).map(q=>({q:q.q,options:q.options.slice(0,3),correct:Number(q.correct)||0}));
let local1v1TickTimer = null;
let local1v1AvatarCache = {};
let local1v1ListUnsub = null;
let local1v1MatchUnsub = null;
let local1v1MatchListenerId = null;
let local1v1Matches = [];
let local1v1CurrentMatchId = null;
let local1v1Message = '';

function local1v1Ref(id=local1v1CurrentMatchId){ return db.collection(LOCAL_1V1_COLLECTION).doc(id); }
function local1v1Key(name){ return docId(name); }
function local1v1IsPlayer(m){ return !!m && (local1v1Key(m.player1)===local1v1Key(currentUser) || local1v1Key(m.player2)===local1v1Key(currentUser)); }
function local1v1Opponent(m){ if(!m) return null; return local1v1Key(m.player1)===local1v1Key(currentUser) ? m.player2 : m.player1; }
function local1v1TimeValue(v){ if(!v) return null; return typeof v.toMillis==='function' ? v.toMillis() : Number(v); }
function local1v1TimeLeft(m){ const start=local1v1TimeValue(m&&m.startAt); return start ? Math.max(0,LOCAL_1V1_TIME_MS-(Date.now()-start)) : LOCAL_1V1_TIME_MS; }
function local1v1Fmt(ms){ const sec=Math.ceil(ms/1000), mm=Math.floor(sec/60), ss=sec%60; return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function local1v1AvatarFor(name){ return local1v1AvatarCache[local1v1Key(name)] || defaultAvatarData(); }
async function loadLocal1v1Avatar(name){
  if(!name || local1v1AvatarCache[local1v1Key(name)]) return;
  try{ const acc=await fetchAccount(name); local1v1AvatarCache[local1v1Key(name)] = (acc && (acc.profileImageUrl || acc.state?.profileImageUrl)) || defaultAvatarData(); if(view==='local-duel') renderLocal1v1Lobby(); }
  catch(e){}
}
function local1v1Sort(a,b){
  const av=a.createdAt?.seconds||0, bv=b.createdAt?.seconds||0;
  return bv-av;
}
async function loadLocal1v1Matches(){
  try{
    const snap=await db.collection(LOCAL_1V1_COLLECTION).where('players','array-contains',currentUser).get();
    local1v1Matches=snap.docs.map(d=>({id:d.id,...d.data()})).sort(local1v1Sort);
    return local1v1Matches;
  }catch(e){
    console.warn('local 1v1 list:',e);
    return local1v1Matches;
  }
}
function ensureLocal1v1Listener(){
  if(local1v1ListUnsub || !currentUser) return;
  local1v1ListUnsub=db.collection(LOCAL_1V1_COLLECTION).where('players','array-contains',currentUser).onSnapshot(snap=>{
    local1v1Matches=snap.docs.map(d=>({id:d.id,...d.data()})).sort(local1v1Sort);
    if(view==='local-duel') renderLocal1v1Lobby();
  },e=>console.warn('local 1v1 list listener:',e));
}
function ensureLocal1v1MatchListener(id){
  if(!id) return;
  if(local1v1MatchUnsub && local1v1MatchListenerId===id) return;
  if(local1v1MatchUnsub) { local1v1MatchUnsub(); local1v1MatchUnsub=null; }
  local1v1CurrentMatchId=id;
  local1v1MatchListenerId=id;
  local1v1MatchUnsub=local1v1Ref(id).onSnapshot(snap=>{
    if(!snap.exists){ local1v1CurrentMatchId=null; local1v1MatchListenerId=null; view='local-duel'; renderLocal1v1Lobby(); return; }
    local1v1Cache({id:snap.id,...snap.data()});
    if(view==='local-duel-match') renderLocal1v1Match();
    if(view==='local-duel') renderLocal1v1Lobby();
  },e=>console.warn('local 1v1 match listener:',e));
}
function startLocal1v1Ticker(){
  if(local1v1TickTimer) return;
  local1v1TickTimer=setInterval(()=>{
    if(view==='local-duel-match') renderLocal1v1Match();
    else if(view==='local-duel') renderLocal1v1Lobby();
    else {clearInterval(local1v1TickTimer);local1v1TickTimer=null;}
  },1000);
}
function local1v1Cache(data){ if(data) localStorage.setItem(LOCAL_1V1_STORAGE_KEY,JSON.stringify(data)); }
function local1v1Score(m,name){ return ((m.answers||{})[local1v1Key(name)]||[]).reduce((n,a,i)=>n+(Number(a)===LOCAL_1V1_QUESTIONS[i]?.correct?1:0),0); }
function local1v1Answered(m,name){ return ((m.answers||{})[local1v1Key(name)]||[]).filter(a=>a!==null&&typeof a!=='undefined').length; }
function local1v1BothSearched(m){
  const p=m?.presence||{};
  return !!(p[local1v1Key(m.player1)] && p[local1v1Key(m.player2)]);
}
async function local1v1Search(){
  local1v1Message='';
  await loadLocal1v1Matches();
  const matches=local1v1Matches.filter(local1v1IsPlayer);
  if(!matches.length){ local1v1Message='لا توجد مباريات متاحة حالياً'; renderLocal1v1Lobby(); return; }
  try{
    const batch=db.batch();
    matches.filter(m=>!m.completed).forEach(m=>batch.update(db.collection(LOCAL_1V1_COLLECTION).doc(m.id),{[`presence.${local1v1Key(currentUser)}`]:firebase.firestore.FieldValue.serverTimestamp()}));
    await batch.commit();
    local1v1Message='';
  }catch(e){local1v1Message='تعذر الاتصال ببطولة التحدي حالياً.';}
  await loadLocal1v1Matches(); renderLocal1v1Lobby();
}
async function local1v1EnterMatch(id){
  local1v1CurrentMatchId=id;
  const ref=local1v1Ref(id);
  try{
    await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);
      if(!snap.exists) throw new Error('لا توجد مباراة');
      const d=snap.data();
      if(!local1v1IsPlayer(d) || d.completed) throw new Error('المباراة غير متاحة');
      if(!local1v1BothSearched(d)) throw new Error('بانتظار الطرف الآخر');
      const key=local1v1Key(currentUser), update={};
      update[`entered.${key}`]=firebase.firestore.FieldValue.serverTimestamp();
      update[`answers.${key}`]=Array.isArray((d.answers||{})[key])?(d.answers||{})[key]:[];
      if(!d.startAt) update.startAt=firebase.firestore.FieldValue.serverTimestamp();
      tx.update(ref,update);
    });
    local1v1Message=''; ensureLocal1v1MatchListener(id); view='local-duel-match'; renderLocal1v1Match(); startLocal1v1Ticker();
  }catch(e){local1v1Message='تعذر دخول المباراة حالياً.';renderLocal1v1Lobby();}
}
async function local1v1Answer(index){
  const m=await getLocal1v1Match(local1v1CurrentMatchId); if(!m||m.completed||!m.startAt||local1v1TimeLeft(m)<=0) return;
  const key=local1v1Key(currentUser), arr=Array.isArray((m.answers||{})[key])?(m.answers||{})[key].slice():[];
  const qIndex=arr.length; if(qIndex>=LOCAL_1V1_QUESTIONS.length) return;
  arr.push(Number(index));
  const update={}; update[`answers.${key}`]=arr;
  if(arr.length>=LOCAL_1V1_QUESTIONS.length) update[`finished.${key}`]=firebase.firestore.FieldValue.serverTimestamp();
  try{
    await local1v1Ref(local1v1CurrentMatchId).update(update);
    const fresh=await getLocal1v1Match(local1v1CurrentMatchId);
    if(fresh && (local1v1TimeLeft(fresh)<=0 || Object.keys(fresh.finished||{}).length>=2)) await local1v1Ref(local1v1CurrentMatchId).update({completed:true,completedAt:firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){console.warn('local 1v1 answer:',e);}
  renderLocal1v1Match();
}
async function getLocal1v1Match(id){
  if(!id) return null;
  try{const snap=await local1v1Ref(id).get();return snap.exists?{id:snap.id,...snap.data()}:null;}catch(e){return null;}
}
async function local1v1FinishIfNeeded(){
  const m=await getLocal1v1Match(local1v1CurrentMatchId); if(!m||m.completed) return;
  if((m.startAt&&local1v1TimeLeft(m)<=0)||Object.keys(m.finished||{}).length>=2){try{await local1v1Ref(local1v1CurrentMatchId).update({completed:true,completedAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}}
}
function local1v1MatchStatus(m){
  if(m.completed) return ['منتهية','bad'];
  if(m.startAt) return ['جارية','ok'];
  if(local1v1BothSearched(m)) return ['نشطة — جاهزة للدخول','ok'];
  return ['غير نشطة — بانتظار الطرف الآخر',''];
}
async function renderLocal1v1Lobby(message){
  ensureLocal1v1Listener(); startLocal1v1Ticker();
  await loadLocal1v1Matches();
  const matches=local1v1Matches.filter(local1v1IsPlayer);
  const cards=matches.map(m=>{
    const opp=local1v1Opponent(m), both=local1v1BothSearched(m), status=local1v1MatchStatus(m);
    loadLocal1v1Avatar(opp);
    return `<div class="admin-ad-item local-duel-match-card">
      <div class="admin-ad-item-head"><b>⚔️ ${adminEsc(m.roundName||'مباراة بطولة')}</b><span class="admin-badge ${status[1]}">${status[0]}</span></div>
      <div class="local-duel-opponent"><img class="local-duel-avatar" src="${local1v1AvatarFor(opp)}" alt="صورة الخصم"><div><div class="local-duel-name">${adminEsc(opp)}</div><div class="local-duel-status ${both?'active':'inactive'}">${both?'🟢 الطرفان جاهزان':'🔴 بانتظار الطرف الآخر'}</div></div></div>
      <div class="local-duel-score"><span>أنت: <b>${local1v1Answered(m,currentUser)}/10</b></span><span>الخصم: <b>${local1v1Answered(m,opp)}/10</b></span></div>
      ${both&&!m.completed ? `<button class="btn" data-local-enter="${adminEsc(m.id)}">🚪 دخول المباراة</button>` : `<div class="locked-note">${m.completed?'هذه المباراة منتهية.':'اضغط «ابحث عن خصم الآن» ليظهر استعدادك، ثم انتظر الطرف الآخر.'}</div>`}
    </div>`;
  }).join('');
  root.innerHTML=`${topNavHtml('local-duel')}<div class="card local-duel-card"><h2>⚔️ بطولة التحدي 1v1</h2><div class="local-duel-note">الأدمن يحدد الجولة والخصمين مسبقاً. زر البحث يعرض فقط المباريات المخصصة لحسابك، وليس بحثاً عشوائياً عن لاعبين.</div><button class="btn" id="btn-local1v1-search">🔎 ابحث عن تحدياتك</button><div class="error">${adminEsc(message||local1v1Message||'')}</div><div style="margin-top:18px;">${cards||'<div class="locked-note">لا توجد مباريات مخصصة لك حالياً.</div>'}</div></div>`;
  updateSyncBadge();bindTopNav();
  document.getElementById('btn-local1v1-search').onclick=local1v1Search;
  document.querySelectorAll('[data-local-enter]').forEach(b=>b.onclick=()=>local1v1EnterMatch(b.getAttribute('data-local-enter')));
}
async function renderLocal1v1Match(){
  ensureLocal1v1MatchListener(local1v1CurrentMatchId); startLocal1v1Ticker();
  const m=await getLocal1v1Match(local1v1CurrentMatchId); if(!m||!local1v1IsPlayer(m)){view='local-duel';renderLocal1v1Lobby();return;}
  const opp=local1v1Opponent(m), key=local1v1Key(currentUser), answers=((m.answers||{})[key]||[]), qIndex=answers.length;
  await Promise.all([loadLocal1v1Avatar(currentUser), loadLocal1v1Avatar(opp)]);
  const myAvatar=local1v1AvatarFor(currentUser), oppAvatar=local1v1AvatarFor(opp);
  const buildMatchupHtml = (winnerSide=null) => `<div class="local-duel-matchup">
    <div class="local-duel-player me ${winnerSide==='me'?'winner':''}">${winnerSide==='me'?'<div class="local-duel-crown">👑</div>':''}<img class="local-duel-player-avatar" src="${myAvatar}" alt="صورة ${adminEsc(currentUser)}"><div class="local-duel-player-name">${adminEsc(currentUser)}</div>${winnerSide==='me'?'<div class="local-duel-winner-badge">🏆 الفائز</div>':''}</div>
    <div class="local-duel-vs">VS</div>
    <div class="local-duel-player ${winnerSide==='opp'?'winner':''}">${winnerSide==='opp'?'<div class="local-duel-crown">👑</div>':''}<img class="local-duel-player-avatar" src="${oppAvatar}" alt="صورة ${adminEsc(opp)}"><div class="local-duel-player-name">${adminEsc(opp)}</div>${winnerSide==='opp'?'<div class="local-duel-winner-badge">🏆 الفائز</div>':''}</div>
  </div>`;
  await local1v1FinishIfNeeded(); const fresh=await getLocal1v1Match(local1v1CurrentMatchId) || m;
  const myScore=local1v1Score(fresh,currentUser), oppScore=local1v1Score(fresh,opp), left=local1v1TimeLeft(fresh);
  if(fresh.completed || (fresh.startAt&&left<=0)){
    const winner=myScore===oppScore?'tie':(myScore>oppScore?'me':'opp');
    root.innerHTML=`<div class="card"><div class="local-duel-result"><div class="big">${winner==='tie'?'🤝':winner==='me'?'🏆':'💔'}</div><h3>${winner==='tie'?'تعادل!':winner==='me'?'مبروك! فزت بالمباراة':'انتهت المباراة — الخصم فاز'}</h3><div class="locked-note"><b>${adminEsc(fresh.roundName||'بطولة التحدي')}</b></div>${buildMatchupHtml(winner)}<div class="local-duel-score"><span>${adminEsc(currentUser)}: <b>${myScore}/10</b></span><span>${adminEsc(opp)}: <b>${oppScore}/10</b></span></div><div class="locked-note">انتهت المباراة. المؤقت المشترك: 5 دقائق.</div><button class="btn" id="btn-local1v1-back">العودة لبطولة التحدي</button></div></div>`;
    document.getElementById('btn-local1v1-back').onclick=()=>{view='local-duel';render();};return;
  }
  if(!fresh.startAt){root.innerHTML=`${topNavHtml('local-duel')}<div class="card local-duel-card"><h2>⚔️ ${adminEsc(fresh.roundName||'المباراة')}</h2><div class="locked-note">في انتظار دخول أول لاعب لبدء مؤقت الـ5 دقائق.</div><button class="btn" id="btn-local1v1-back">العودة</button></div>`;updateSyncBadge();bindTopNav();document.getElementById('btn-local1v1-back').onclick=()=>{view='local-duel';render();};return;}
  const q=LOCAL_1V1_QUESTIONS[qIndex];
  if(!q){await local1v1FinishIfNeeded();renderLocal1v1Match();return;}
  root.innerHTML=`${topNavHtml('local-duel')}<div class="card local-duel-card"><div class="duel-timer ${left<=30000?'low':''}">${local1v1Fmt(left)}</div><h3>${adminEsc(fresh.roundName||'بطولة التحدي')}</h3>${buildMatchupHtml()}<div class="local-duel-score"><span>${adminEsc(currentUser)}: <b>${myScore}/10</b> <small>(${answers.length}/10)</small></span><span>${adminEsc(opp)}: <b>${oppScore}/10</b> <small>(${local1v1Answered(fresh,opp)}/10)</small></span></div><div class="duel-progress">السؤال ${qIndex+1} من 10</div><div class="quiz-q">${adminEsc(q.q)}</div>${q.options.map((o,i)=>`<button class="quiz-opt" data-local-answer="${i}">${adminEsc(o)}</button>`).join('')}</div>`;
  updateSyncBadge();bindTopNav();document.querySelectorAll('[data-local-answer]').forEach(b=>b.onclick=()=>local1v1Answer(Number(b.getAttribute('data-local-answer'))));
}

const _render = render;
render = function(){
  if(state && view === 'main') maybeAdvanceDay();
  document.body.setAttribute('data-page', view || 'login');
  _render();
};

        if(d.welcomeTitle && title) title.textContent=d.welcomeTitle;

const UI_MODE_KEY = 'ui_mode';
function getSavedMode(){
  try{ return localStorage.getItem(UI_MODE_KEY) === 'light' ? 'light' : 'dark'; }
  catch(e){ return 'dark'; }
}
function applyUiMode(mode){
  document.body.setAttribute('data-mode', mode);
  const btn = document.getElementById('btn-mode-toggle');
  if(btn) btn.textContent = mode === 'light' ? '🌙' : '☀️';
  try{ localStorage.setItem(UI_MODE_KEY, mode); }catch(e){}
}
function toggleUiMode(){
  const current = document.body.getAttribute('data-mode') === 'light' ? 'light' : 'dark';
  applyUiMode(current === 'light' ? 'dark' : 'light');
}

const modeToggleBtn = document.getElementById('btn-mode-toggle');
if(modeToggleBtn) modeToggleBtn.onclick = toggleUiMode;
